<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello plugin</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1b1f24; --line:#d0d7de; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111519; --fg:#e6e9ee; --line:#29303a; } }
  body { font: 14px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); margin: 0; padding: 16px; max-width: 40em; }
  pre { border: 1px solid var(--line); border-radius: 6px; padding: 8px; overflow: auto; }
  a { color: inherit; }
</style>
</head>
<body>
<h1>Hello plugin</h1>
<p>This page is served by the plugin from its <code>ui</code> folder, inside the OpenVP console. It asks the plugin's own routes what they know.</p>
<pre id="out">Loading…</pre>
<p><a href="/">Back to the console</a></p>
<script>
async function refresh() {
  try {
    const g = await (await fetch("/api/plugins/hello/greeting")).json();
    const s = await (await fetch("/api/plugins/hello/stats")).json();
    document.getElementById("out").textContent = JSON.stringify({ greeting: g, stats: s }, null, 2);
  } catch (e) { document.getElementById("out").textContent = "The plugin didn't answer: " + e.message; }
}
refresh(); setInterval(refresh, 2000);
</script>
</body>
</html>
