<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenVP Debugger</title>
<style>
  :root { --bg:#0f1216; --pane:#151a20; --head:#1b2129; --line:#29303a; --text:#e6e9ee; --muted:#8b95a3; --accent:#4c8dff;
          --sel:#22344f; --hi:#7fe0b1; --lo:#6b7480; --ana:#f2cf7a; --ser:#9ecbff; --err:#e05252; }
  * { box-sizing:border-box; }
  [hidden] { display:none !important; }
  html, body { height:100%; }
  body { margin:0; font:13px/1.35 system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; overflow:hidden; }
  body > * { flex:none; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
  button, input, select { font:inherit; color:var(--text); background:#111519; border:1px solid var(--line); border-radius:4px; padding:3px 8px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.on { background:#173a2c; border-color:#2f9e6e; color:var(--hi); }
  label { display:inline-flex; align-items:center; gap:4px; color:var(--muted); }

  /* title + toolbar */
  .title { display:flex; align-items:center; gap:10px; padding:6px 10px; border-bottom:1px solid var(--line); background:var(--head); }
  .title b { font-size:14px; } .title .muted { color:var(--muted); }
  .title a { color:var(--accent); }
  .toolbar { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); background:var(--pane); }
  .group { display:flex; gap:6px; align-items:center; }
  .sep { width:1px; height:20px; background:var(--line); }

  /* panes */
  .panes { flex:1 1 auto; min-height:0; display:grid; grid-template-columns: var(--left, 42%) 5px 1fr; grid-template-rows:minmax(0,1fr); }
  .pane { display:grid; grid-template-rows:auto auto 1fr; min-height:0; min-width:0; background:var(--pane); }
  .pane.sigpane { grid-template-rows:auto auto auto 1fr auto; }
  .pane h2 { margin:0; padding:5px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
             background:var(--head); border-bottom:1px solid var(--line); display:flex; gap:8px; align-items:center; }
  .pane h2 .count { margin-left:auto; text-transform:none; letter-spacing:0; }
  .pane .filters { display:flex; gap:6px; padding:5px 8px; border-bottom:1px solid var(--line); align-items:center; flex-wrap:wrap; }
  .pane .filters input[type=search] { flex:1; min-width:120px; }
  .splitter { background:var(--line); cursor:col-resize; }
  .splitter:hover, .splitter.drag { background:var(--accent); }
  .scroll { overflow:auto; min-height:0; }

  /* segmented flat|tree toggle, help tooltip */
  .seg { display:inline-flex; text-transform:none; letter-spacing:0; }
  .seg button { padding:1px 8px; border-radius:0; font-size:11px; color:var(--muted); }
  .seg button:first-child { border-radius:4px 0 0 4px; } .seg button:last-child { border-radius:0 4px 4px 0; border-left:0; }
  .seg button.on { background:var(--sel); border-color:var(--accent); color:var(--text); }
  .help { display:inline-flex; align-items:center; justify-content:center; width:18px; height:18px; border:1px solid var(--line); border-radius:50%;
          color:var(--muted); font-size:11px; cursor:help; flex:none; text-transform:none; }
  .help:hover { color:var(--text); border-color:var(--accent); }
  .minibtn { padding:1px 7px; font-size:11px; color:var(--muted); }

  /* watch-group tabs */
  .tabs { display:flex; gap:2px; padding:4px 8px 0; border-bottom:1px solid var(--line); background:var(--pane); overflow-x:auto; }
  .tab { padding:3px 10px; border:1px solid transparent; border-bottom:0; border-radius:4px 4px 0 0; background:transparent; color:var(--muted); white-space:nowrap; }
  .tab:hover { color:var(--text); border-color:var(--line); }
  .tab.on { background:var(--sel); color:var(--text); border-color:var(--line); }
  .tab small { color:var(--muted); margin-left:4px; }
  .tab.plus { color:var(--accent); font-weight:600; }

  table { width:100%; border-collapse:collapse; table-layout:fixed; }
  thead th { position:sticky; top:0; z-index:1; background:var(--head); color:var(--muted); font-weight:500; font-size:11px;
             text-align:left; padding:4px 6px; border-bottom:1px solid var(--line); border-right:1px solid var(--line); user-select:none; }
  th.sortable { cursor:pointer; } th.sortable:hover { color:var(--text); }
  td { padding:2px 6px; border-bottom:1px solid #1e242c; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  tbody tr:hover { background:#1a2029; }
  tbody tr.sel { background:var(--sel); }
  #sigs td:first-child, #sigs th:first-child { text-align:center; padding:2px 0; }
  .k-Digital { color:var(--lo); } .k-Digital.high { color:var(--hi); font-weight:600; }
  .k-Analog { color:var(--ana); } .k-Serial { color:var(--ser); }
  .type { color:var(--muted); }
  #sigs td.chg { color:var(--muted); text-align:right; font-size:11px; }
  #trace td.n { color:var(--muted); text-align:right; }
  #trace td.dt { color:var(--muted); text-align:right; }
  #trace td.via { color:var(--muted); font-size:11px; }
  #trace.nocause .via, #trace.nocause col.via { display:none; }
  #trace tr.flash { animation: flash .6s ease-out; }
  @keyframes flash { from { background:#2a3b22; } to { background:transparent; } }
  .empty { padding:24px; color:var(--muted); text-align:center; }

  /* activity glow: two identical keyframes, swapped per change so the animation restarts without a reflow */
  #sigs tr.g1 { animation: glow1 2s ease-out; } #sigs tr.g2 { animation: glow2 2s ease-out; }
  @keyframes glow1 { from { background:rgba(127,224,177,.38); } to { background:transparent; } }
  @keyframes glow2 { from { background:rgba(127,224,177,.38); } to { background:transparent; } }

  /* tree view */
  #sigs tr.folder td { background:#181e26; color:var(--text); cursor:pointer; user-select:none; font-weight:500; border-bottom:1px solid var(--line); }
  #sigs tr.folder:hover td { background:#1d2531; }
  #sigs tr.folder td { text-align:left; }
  #sigs tr.folder .tw { display:inline-block; width:14px; color:var(--muted); }
  #sigs tr.folder .fc { color:var(--muted); font-weight:400; margin-left:6px; font-size:11px; }
  #sigs tr.folder .adot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-left:8px; background:transparent; vertical-align:middle; transition:background 1s; }
  #sigs tr.folder.act .adot { background:var(--hi); transition:none; }

  /* causality bands in the trace (alternate per burst) */
  #trace tbody tr.b1 { background:rgba(76,141,255,.07); }
  #trace tbody tr.b1:hover { background:#1a2029; }
  #trace td.cause-name .arrow { color:var(--muted); }

  /* inline "drives / driven by" panel */
  .rel { border-top:1px solid var(--accent); background:#121820; max-height:min(240px, 40vh); overflow:auto; min-height:0; }
  .rel .relhd { position:sticky; top:0; display:flex; align-items:center; gap:8px; padding:4px 8px; background:var(--head); border-bottom:1px solid var(--line); }
  .rel .relhd b { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rel .sym { padding:4px 8px; border-bottom:1px solid #1e242c; }
  .rel .sym .path { color:var(--muted); margin-left:6px; font-size:11px; }
  .rel .sym .dev { color:var(--ana); font-size:10px; margin-left:6px; border:1px solid var(--ana); border-radius:3px; padding:0 3px; }
  .rel .chips { display:flex; flex-wrap:wrap; gap:3px 4px; margin-top:3px; }
  .rel .chip { padding:0 6px; border:1px solid var(--line); border-radius:9px; cursor:pointer; background:#111519; }
  .rel .chip:hover { border-color:var(--accent); }
  .rel .chip.me { border-color:var(--hi); color:var(--hi); }

  /* force bar + status */
  .force { display:flex; flex-wrap:wrap; gap:6px; align-items:center; padding:6px 10px; border-top:1px solid var(--line); background:var(--pane); }
  .force input.name { flex:1; min-width:180px; } .force input.val { width:180px; }
  .status { display:flex; gap:0; border-top:1px solid var(--line); background:var(--head); color:var(--muted); font-size:12px; }
  .status span { padding:3px 10px; border-right:1px solid var(--line); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .status .grow { flex:1; }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--lo); margin-right:5px; vertical-align:middle; }
  .dot.ok { background:#2f9e6e; } .dot.bad { background:var(--err); }

  /* waveform panel */
  #wavewrap { height:var(--wh, 220px); display:flex; flex-direction:column; border-top:1px solid var(--line); background:var(--pane); }
  #wsplit { height:5px; flex:none; background:var(--line); cursor:row-resize; }
  #wsplit:hover, #wsplit.drag { background:var(--accent); }
  #wavebody { flex:1; min-height:0; position:relative; overflow:hidden; }

  /* step-through */
  :root { --brk:#e0a052; --pause:#3a2a12; }
  button.step-on { background:#3a2a12; border-color:var(--brk); color:#ffd9a8; }
  button:disabled { opacity:.45; cursor:default; } button:disabled:hover { border-color:var(--line); }
  .stepbar { display:flex; flex-wrap:wrap; gap:6px 12px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line);
             background:#1d1a14; color:#e8d6bb; }
  .stepbar.off { display:none; }
  .stepbar.paused { background:var(--pause); }
  .stepbar .what { flex:1; min-width:200px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .stepbar .what b { color:#fff; }
  .stepbar .hint { color:var(--muted); font-size:12px; }
  #sigs td.b, #sigs th.b { text-align:center; padding:2px 0; }
  #sigs input.brk { accent-color:var(--brk); }
  tbody tr.hist, tbody tr.hist:hover { background:#182a40; box-shadow: inset 3px 0 0 var(--accent); }
  .stepbar.history { background:#15243a; color:#cfe0ff; }
  td.past { font-style:italic; text-decoration: underline dotted var(--accent); }
  tbody tr.paused, tbody tr.paused:hover { background:var(--pause); box-shadow: inset 3px 0 0 var(--brk); }

  /* context menu */
  #menu { position:fixed; z-index:10; min-width:170px; max-height:90vh; overflow:auto; background:#1b2129; border:1px solid var(--line); border-radius:6px; padding:4px 0;
          box-shadow:0 8px 24px rgba(0,0,0,.45); display:none; }
  #menu div { padding:5px 14px; cursor:pointer; } #menu div:hover { background:var(--sel); }
  #menu hr { border:0; border-top:1px solid var(--line); margin:4px 0; }
  #menu .hd { color:var(--muted); font-size:11px; cursor:default; } #menu .hd:hover { background:none; }

  @media (max-width: 760px) {
    body { display:block; overflow:auto; }
    .panes { grid-template-columns: 1fr; grid-template-rows: 55vh 0 55vh; }
    .splitter { display:none; }
    .title, .group { flex-wrap:wrap; }
    .title select, .toolbar select { max-width:100%; }
    #prog { flex-basis:100%; order:5; }
    #wavewrap { height:200px; }
    #sigs col:nth-child(4), #sigs col:nth-child(5), #trace col.via { width:0 !important; }
    #sigs tbody tr:not(.folder) td:nth-child(4), #sigs tbody tr:not(.folder) td:nth-child(5), #sigs th:nth-child(4), #sigs th:nth-child(5), #trace .via { padding:0; border:0; font-size:0; overflow:hidden; }
  }
</style>
</head>
<body>
<div class="title">
  <b>Debugger</b>
  <select id="slot" title="Program slot"></select>
  <span id="prog" class="muted mono"></span>
  <span style="flex:1"></span>
  <a id="pathslink" href="paths.html" target="_blank" rel="noopener" title="Open the signal paths view (follows the selected signal)">Paths</a>
  <a href="/">Console</a>
</div>

<div class="toolbar">
  <div class="group">
    <button id="stream" class="on" title="Start/stop recording signal changes in the trace (F5)">● Stream</button>
    <button id="clear" title="Clear the trace window">Clear</button>
    <button id="save" title="Save the trace to a text file">Save…</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <button id="stepmode" title="Step mode: pause the program on each signal change until you press Next (Ctrl+F5)">⏸ Step</button>
    <button id="stepback" disabled title="Look at the step before this one: values as they were then (F7). The program stays where it is.">◀| Back</button>
    <button id="stepnext" disabled title="Let the paused change through and stop at the next one (F10)">Next ▶|</button>
    <button id="steprun" disabled title="Turn step mode off and let the program run (F8)">Run ▶▶</button>
    <label title="Which changes pause the program">Break on <select id="bmode"><option value="all">every change</option><option value="marked">marked signals ⏸</option></select></label>
  </div>
  <div class="sep"></div>
  <div class="group">
    <label>Trace <select id="tmode"><option value="all">all signals</option><option value="watch">checked signals only</option></select></label>
    <button id="wavebtn" title="Show a waveform (logic analyzer) of the signals checked for trace">Waveform</button>
  </div>
  <div class="sep"></div>
  <div class="group">
    <label>Time <select id="tfmt"><option value="abs">absolute</option><option value="rel">relative</option></select></label>
    <label>Analog <select id="afmt"><option value="dec">decimal</option><option value="hex">hex</option><option value="pct">percent</option></select></label>
    <label>Serial <select id="sfmt"><option value="ascii">ASCII</option><option value="hex">hex</option></select></label>
    <label><input type="checkbox" id="autoscroll" checked> auto-scroll</label>
  </div>
</div>

<div class="stepbar off" id="stepbar">
  <span class="what" id="stepwhat"></span>
  <button id="stepback2" title="F7">◀| Back</button>
  <button id="stepnext2" title="F10">Next ▶|</button>
  <button id="steprun2" title="F8">Run ▶▶</button>
  <span class="hint">F7 back · F10 next · F8 run · F9 mark/unmark selected signal</span>
</div>

<div class="panes" id="panes">
  <section class="pane sigpane">
    <h2>Signals <span class="seg" id="viewseg"><button data-v="flat" title="One flat list">flat</button><button data-v="tree" title="Group signals into folders by program structure or name prefix">tree</button></span>
      <span class="count mono" id="sigcount"></span></h2>
    <div class="tabs" id="tabs"></div>
    <div class="filters">
      <input type="search" id="search" placeholder="Find signal" class="mono" autocomplete="off">
      <span class="help" id="shelp" title="">?</span>
      <select id="kfilter" title="Signal type">
        <option value="">all types</option><option>Digital</option><option>Analog</option><option>Serial</option>
      </select>
      <select id="sortsel" title="Sort order (column headers sort too)">
        <option value="name">sort: name</option><option value="kind">sort: type</option>
        <option value="recent">sort: recently changed</option><option value="count">sort: most changes</option>
      </select>
      <label title="Show only signals checked for tracing"><input type="checkbox" id="onlychecked"> checked</label>
      <label title="Show only signals marked to break on"><input type="checkbox" id="onlybreak"> ⏸ marked</label>
      <label title="Show only signals that changed since the page loaded or activity was last reset"><input type="checkbox" id="activeonly"> active only</label>
      <button id="resetact" class="minibtn" title="Forget which signals changed and how often">reset activity</button>
      <button id="checkall" title="Check every visible signal">✓ all</button>
      <button id="checknone" title="Uncheck every visible signal">✗ all</button>
      <span id="foldbtns" hidden><button id="fold" class="minibtn" title="Collapse every folder">⊟</button> <button id="unfold" class="minibtn" title="Expand every folder">⊞</button></span>
    </div>
    <div class="scroll" id="sigscroll">
      <table id="sigs">
        <colgroup><col style="width:28px"><col style="width:28px"><col><col style="width:62px"><col style="width:40px"><col style="width:34%"></colgroup>
        <thead><tr><th title="Trace this signal">T</th><th class="b" title="Break: pause on changes to this signal when Break on = marked signals (F9)">⏸</th><th class="sortable" data-sort="name">Signal name</th><th class="sortable" data-sort="kind">Type</th><th class="sortable" data-sort="count" title="Number of changes seen">Chg</th><th>Value</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="sigempty" hidden>No program in this slot.</div>
      <div class="empty" id="signone" hidden>No signal matches.</div>
    </div>
    <div class="rel" id="rel" hidden>
      <div class="relhd"><b id="reltitle"></b><button id="relclose" class="minibtn" title="Close">×</button></div>
      <div id="relbody"></div>
    </div>
  </section>
  <div class="splitter" id="splitter"></div>
  <section class="pane">
    <h2>Trace <span class="count mono" id="tracecount"></span></h2>
    <div class="filters">
      <input type="search" id="tsearch" placeholder="Filter trace" class="mono" autocomplete="off">
      <span class="help" id="thelp" title="">?</span>
      <select id="follow" title="Limit the trace to the signal selected in the list">
        <option value="off">follow: off</option><option value="one">only selected</option><option value="near">selected + neighbours</option>
      </select>
      <label title="Show only the rows of the same burst (chain) as the clicked trace row"><input type="checkbox" id="burst"> this burst only</label>
    </div>
    <div class="scroll" id="tracescroll">
      <table id="trace" class="nocause">
        <colgroup><col style="width:52px"><col style="width:104px"><col style="width:76px"><col><col class="via" style="width:84px"><col style="width:24%"><col style="width:64px"></colgroup>
        <thead><tr><th>#</th><th>Time</th><th title="Time since the row above it (among the rows the filter shows)">Δ</th><th>Signal name</th><th class="via" title="The program symbol whose output produced this change (hover a row for the signal that triggered it)">via</th><th>Value</th><th>Source</th></tr></thead>
        <tbody></tbody>
      </table>
      <div class="empty" id="traceempty">Waiting for signal changes…</div>
    </div>
  </section>
</div>

<div id="wavewrap" hidden>
  <div id="wsplit" title="Drag to resize"></div>
  <div id="wavebody"></div>
</div>

<div class="force">
  <b style="color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.06em">Force</b>
  <input id="fname" class="name mono" placeholder="signal name (pick one in the list)" list="siglist">
  <datalist id="siglist"></datalist>
  <input id="fval" class="val mono" placeholder="value: 1 · 500 · 1F4h · 50% · text\x0D">
  <button id="fset">Set</button><button id="fclear">Clear</button><button id="fpulse">Pulse</button>
  <span id="fmsg" class="muted"></span>
</div>

<div class="status">
  <span id="st-conn"><i class="dot"></i>disconnected</span>
  <span id="st-state">—</span>
  <span id="st-sigs">0 signals</span>
  <span id="st-trace">0 in trace</span>
  <span class="grow" id="st-msg"></span>
</div>

<div id="menu"></div>

<script src="openvp-auth.js"></script>
<script src="debugger-wave.js"></script>
<script>
openvpAuth.init();
const $ = s => document.querySelector(s);
const MAX_TRACE = 5000;
const store = {
  get(k, d) { try { const v = localStorage.getItem("openvp.dbg." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("openvp.dbg." + k, JSON.stringify(v)); } catch { } }
};
const debounce = (fn, ms) => { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; };

let slot = Number(new URLSearchParams(location.search).get("slot")) || 1;
let ws = null, streaming = true, sortBy = store.get("sort", "name"), sortDir = store.get("sortdir", 1), selected = null;
if (!["name", "kind", "recent", "count"].includes(sortBy)) sortBy = "name";
if (sortBy === "recent" || sortBy === "count") sortDir = -1; else if (sortDir !== -1) sortDir = 1;
let signals = new Map();      // name -> { name, lname, kind, value, watch, brk, lastChange, changeCount, tr, valTd, chk, ... }
let trace = [];               // { n, time, signal, kind, value, source, symbol, cause, depth, chain, tr }
let seq = 0, firstTime = null, pending = [], rafQueued = false, refreshTimer = null;
// Step-through state, mirrored from the server (which owns it: the pause happens in the logic engine).
let currentState = "—", stepVersion = -1;
// Step-back history (page-side). Every change is logged with the value it replaced, and every pause
// remembers which change it stopped on, so values at any earlier step can be rebuilt by undoing later changes.
const MAX_CHANGES = 50000;
let changes = [], cseq = 0;   // { cn, time, signal, prev, value }
let stepLog = [];             // { step, signal, kind, value, source, cn }
let view = null, viewVals = null; // index into stepLog while looking back; null = live
let step = { enabled: false, onlyBreakSignals: false, breakSignals: new Set(), paused: null }, stepSynced = false;
const opts = { tmode: store.get("tmode", "all"), tfmt: store.get("tfmt", "abs") === "rel" ? "rel" : "abs", afmt: store.get("afmt", "dec"), sfmt: store.get("sfmt", "ascii") };
for (const k of Object.keys(opts)) { $("#" + k).value = opts[k]; $("#" + k).onchange = e => { opts[k] = e.target.value; store.set(k, opts[k]); rerenderValues(); }; }

async function api(path, init) {
  const r = await fetch(path, init);
  if (openvpAuth.check(r)) throw new Error("Log in with the access key first.");
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(body.error || body || r.statusText);
  return body;
}

// ---------------------------------------------------------------- formatting

function isHigh(v) { return v === true || v === 1 || v === "1" || v === "True" || v === "true"; }

function fmt(kind, v) {
  if (kind === "Digital") return isHigh(v) ? "1" : "0";
  if (kind === "Analog") {
    const n = Number(v) || 0, u = n & 0xFFFF;
    if (opts.afmt === "hex") return u.toString(16).toUpperCase().padStart(4, "0") + "h";
    if (opts.afmt === "pct") return (u * 100 / 65535).toFixed(1) + "%";
    return n + "d";
  }
  const s = v == null ? "" : String(v);
  if (opts.sfmt === "hex") return [...s].map(c => (c.charCodeAt(0) & 0xFF).toString(16).toUpperCase().padStart(2, "0")).join(" ");
  return s.replace(/[\x00-\x1F\x7F-\xFF\\]/g, c => c === "\\" ? "\\\\" : "\\x" + c.charCodeAt(0).toString(16).toUpperCase().padStart(2, "0"));
}

// Parse what the user typed in the force box into the value to send.

// ---------------------------------------------------------------- search language

const SEARCH_HELP = "Search syntax (all terms must match, case-insensitive):\n" +
  "  word word      every word must appear in the name\n" +
  "  Room*Power     * matches anything\n" +
  "  /regex/        regular expression on the name\n" +
  "  d: a: s:       type: Digital / Analog / Serial (d:vol = digital with 'vol' in the name)\n" +
  "  =1  =500  =on  current value equals (value as shown, or number)\n" +
  "  >100  <50%  >=1Fh  numeric value tests (digital is 0/1)\n" +
  "  -term          exclude: -tp01  -d:  -/regex/";
$("#shelp").title = $("#thelp").title = SEARCH_HELP;

const escRe = s => s.replace(/[.+?^${}()|[\]\\]/g, "\\$&");
function textTest(s) {
  if (!s) return null;
  if (s.includes("*")) { const re = new RegExp(s.split("*").map(escRe).join(".*"), "i"); return o => re.test(o.name); }
  const ls = s.toLowerCase();

}
function numOf(kind, v) { if (kind === "Digital") return isHigh(v) ? 1 : 0; const n = Number(v); return v === "" || v == null ? NaN : n; }
function parseNum(t) {
  t = t.trim(); let m;

  if ((m = /^([0-9a-f]+)h$/i.exec(t)) || (m = /^0x([0-9a-f]+)$/i.exec(t))) return parseInt(m[1], 16);
  return t === "" ? NaN : Number(t.replace(/d$/i, ""));
}
// Returns null for an empty query, else { test(o), usesValue }. `o` needs name, lname, kind, value.
function compileQuery(text) {
  text = (text || "").trim();
  if (!text) return null;
  const toks = text.match(/-?\/(?:\\.|[^\/\\])+\/i?|\S+/g) || [];
  const terms = []; let usesValue = false;
  for (let t of toks) {
    let neg = false, test = null, m;
    if (t.length > 1 && t[0] === "-") { neg = true; t = t.slice(1); }
    if ((m = /^\/((?:\\.|[^\/\\])+)\/i?$/.exec(t))) {
      try { const re = new RegExp(m[1], "i"); test = o => re.test(o.name); } catch { continue; }
    } else if ((m = /^([das]):(.*)$/i.exec(t))) {
      const k = { d: "Digital", a: "Analog", s: "Serial" }[m[1].toLowerCase()], sub = textTest(m[2]);
      test = o => o.kind === k && (!sub || sub(o));
    } else if ((m = /^(>=|<=|>|<|=)(.+)$/.exec(t))) {
      usesValue = true;
      const op = m[1], rest = m[2], lt = rest.toLowerCase(), n = parseNum(rest);
      if (op === "=") {
        const dig = /^(1|true|on|high)$/.test(lt) ? 1 : /^(0|false|off|low)$/.test(lt) ? 0 : NaN;
        test = o => {
          if (fmt(o.kind, o.value).toLowerCase() === lt) return true;
          if (o.kind === "Serial") return String(o.value ?? "").toLowerCase() === lt;
          if (o.kind === "Digital") return numOf("Digital", o.value) === dig;
          return !isNaN(n) && numOf(o.kind, o.value) === n;
        };
      } else {
        test = o => {
          const v = numOf(o.kind, o.value); if (isNaN(v) || isNaN(n)) return false;
          return op === ">" ? v > n : op === "<" ? v < n : op === ">=" ? v >= n : v <= n;

}

// ---------------------------------------------------------------- program graph

let graph = null;   // { symbols, bySig: Map name -> {out:[sym], in:[sym]} } or null when the server can't describe the program
const CONST_SIGS = new Set(["0", "1"]);
function setGraph(g) {
  if (!g || !Array.isArray(g.symbols)) { graph = null; return; }
  const bySig = new Map(), slotFor = n => { let e = bySig.get(n); if (!e) bySig.set(n, e = { out: [], in: [] }); return e; };
  for (const sym of g.symbols) {
    for (const n of sym.outputs || []) if (!CONST_SIGS.has(n)) slotFor(n).out.push(sym);
    for (const n of sym.inputs || []) if (!CONST_SIGS.has(n)) slotFor(n).in.push(sym);

}
// The symbol a signal "belongs" to for the tree: a device it is attached to, else any symbol that has a module path.
function symOf(name) {

// ---------------------------------------------------------------- signal list

function watchKey() { return "watch." + slot; }
function saveWatch() { store.set(watchKey(), [...signals.values()].filter(s => s.watch).map(s => s.name)); }
// Anything that changes which signals are checked for tracing lands here.
function watchChanged() { saveWatch(); applyFilter(); renderTabs(); scheduleLanes(); }

async function loadSignals() {
  const [list, g] = await Promise.all([api(`/api/slots/${slot}/signals`).catch(() => []), api(`/api/slots/${slot}/graph`).catch(() => null)]);
  setGraph(g);
  const watched = new Set(store.get(watchKey(), []));
  const old = signals;
  signals = new Map();
  for (const s of list) {
    const prev = old.get(s.name);
    signals.set(s.name, { name: s.name, lname: s.name.toLowerCase(), kind: s.kind, value: s.value, watch: prev ? prev.watch : watched.has(s.name), brk: step.breakSignals.has(s.name),
                          lastChange: prev ? prev.lastChange : 0, changeCount: prev ? prev.changeCount : 0 });
  }

}

function sortedSignals() {
  const arr = [...signals.values()], nm = (a, b) => a.name.localeCompare(b.name, undefined, { numeric: true });
  let cmp;
  if (sortBy === "kind") cmp = (a, b) => a.kind.localeCompare(b.kind) || nm(a, b);
  else if (sortBy === "recent") cmp = (a, b) => (a.lastChange - b.lastChange) || nm(b, a);   // dir -1 => newest first, then by name
  else if (sortBy === "count") cmp = (a, b) => (a.changeCount - b.changeCount) || nm(b, a);

    chk.onclick = e => { e.stopPropagation(); s.watch = chk.checked; watchChanged(); };
    const c0 = document.createElement("td"); c0.appendChild(chk);
    const bchk = document.createElement("input"); bchk.type = "checkbox"; bchk.className = "brk"; bchk.checked = s.brk; bchk.title = "Break on this signal";

function syncSortUi() {

    th.textContent = th.textContent.replace(/ [▲▼]$/, "") + (th.dataset.sort === sortBy ? (sortDir > 0 ? " ▲" : " ▼") : ""));

function paintValue(s) {
  if (!s.valTd) return;

  const v = past ? viewVals.get(s.name) : s.value;

// ---- tree: folders are built once per signal list / graph, then only shown, hidden and re-ordered.
let viewMode = store.get("view", "flat") === "tree" ? "tree" : "flat";
let tree = null;                        // { root, folders[] }
let collapsedMap = {};                  // folder key -> bool (explicit choices)
const collapsedKey = () => "collapsed." + slot;

  const mk = (key, label, parent, title) => {
    const f = { key, label, parent, depth: parent ? parent.depth + 1 : 0, kids: [], items: [], total: 0, vis: 0, last: 0, lit: false, agg: 0, closed: false,
                collapsed: key in collapsedMap ? collapsedMap[key] : bigDefault };
    if (parent) {
      parent.kids.push(f);
      const tr = document.createElement("tr"); tr.className = "folder";
      const td = document.createElement("td"); td.colSpan = 6; td.style.paddingLeft = (6 + (f.depth - 1) * 14) + "px";
      td.innerHTML = '<span class="tw"></span><span class="fl"></span><span class="fc mono"></span><i class="adot"></i>';
      td.querySelector(".fl").textContent = label; if (title) td.title = title;
      tr.appendChild(td); tr.onclick = () => toggleFolder(f);

    } else if (sym && sym.group) {

}
function setAllFolders(c) { if (!tree) return; for (const f of tree.folders) { f.collapsed = c; collapsedMap[f.key] = c; } store.set(collapsedKey(), collapsedMap); applyFilter(); }

let lastLayout = 0;
// (Re)order the table body: flat sorted list, or folders with their signals under them.
function layout() {

  const tb = $("#sigs tbody"), frag = document.createDocumentFragment(), arr = sortedSignals();
  if (viewMode === "tree") {
    const t = ensureTree();
    for (const f of t.folders) { f.items = []; f.agg = 0; }
    for (const s of arr) {
      s.folder.items.push(s);
      for (let f = s.folder; f && f !== t.root; f = f.parent) f.agg = sortBy === "recent" ? Math.max(f.agg, s.lastChange) : f.agg + s.changeCount;
    }
    const fcmp = sortBy === "recent" || sortBy === "count" ? (a, b) => (b.agg - a.agg) || a.label.localeCompare(b.label, undefined, { numeric: true })
                                                            : (a, b) => a.label.localeCompare(b.label, undefined, { numeric: true });
    const emit = f => {
      if (f !== t.root) frag.appendChild(f.tr);

      for (const s of f.items) {

        s.nameTd.style.paddingLeft = (6 + s.depth * 14 + 14) + "px";

      }

    for (const s of arr) {

function setViewMode(v) {

  $("#foldbtns").hidden = v !== "tree";

let curQuery = null;
function applyFilter() {
  const q = compileQuery($("#search").value), k = $("#kfilter").value, only = $("#onlychecked").checked, onlyB = $("#onlybreak").checked, act = $("#activeonly").checked;
  curQuery = q;
  const grp = activeTab ? groups.get(activeTab) : null;
  const isTree = viewMode === "tree" && tree;
  const forceOpen = !!q;                    // a search overrides collapsed folders so matches are never hidden
  if (isTree) {

  }

    const vis = (!q || q.test(s)) && (!k || s.kind === k) && (!only || s.watch) && (!onlyB || s.brk) && (!act || s.changeCount > 0) && (!grp || grp.has(s.name));

  $("#signone").textContent = activeTab && groups.get(activeTab)?.size === 0 ? "This group is empty: right-click a signal and choose Add to group." : "No signal matches.";

const pathsUrl = name => `paths.html?slot=${slot}` + (name ? `&signal=${encodeURIComponent(name)}` : "");

function revealSignal(name) {

// ---------------------------------------------------------------- trace

let followMode = store.get("follow", "off"), followSet = null, selChain = null, selTraceE = null, hasCause = false, lastChain = undefined, band = 0;
$("#follow").value = followMode;

// Δ column: time since the previous row that is shown (so it follows the filter).
function fmtDelta(e, prev) { return prev ? "+" + ((e.time - prev.time) / 1000).toFixed(3) + "s" : ""; }
function traceVisible(e, q, fset, burst) {
  if (q && !q.test({ name: e.signal, lname: e.lname, kind: e.kind, value: e.value })) return false;
  if (fset && !fset.has(e.signal)) return false;
  if (burst != null && e.chain !== burst) return false;
  return true;
}
function traceFilterState() {
  const q = compileQuery($("#tsearch").value);
  let fset = null;
  if (followMode !== "off") fset = selected ? (followMode === "near" && graph ? neighbours(selected) : new Set([selected])) : new Set();
  followSet = fset;
  const burst = $("#burst").checked && selChain != null ? selChain : null;
  return { q, fset, burst };
}
function lastShown() { for (let i = trace.length - 1; i >= 0; i--) if (!trace[i].tr.hidden) return trace[i]; return null; }
function applyTraceFilter() {
  const { q, fset, burst } = traceFilterState();
  let prev = null;
  for (const e of trace) {
    const show = traceVisible(e, q, fset, burst);
    e.tr.hidden = !show;
    if (show) { e.tr.children[2].textContent = fmtDelta(e, prev); prev = e; }
  }
}

function onTrace(m) {
  let s = signals.get(m.signal);
  const cn = ++cseq, time = Date.parse(m.time);
  changes.push({ cn, time, signal: m.signal, prev: s ? s.value : undefined, value: m.value });
  if (changes.length > MAX_CHANGES) changes.splice(0, changes.length - MAX_CHANGES);
  const h = stepLog[stepLog.length - 1];
  if (h && h.cn == null && h.signal === m.signal) h.cn = cn; // pause notice beat its trace event here
  if (s) { s.value = m.value; paintValue(s); noteChange(s); }
  else scheduleRefresh();
  waveFeed({ time, signal: m.signal, kind: m.kind, value: m.value }, s);
  if (!streaming) return;
  if (opts.tmode === "watch" && !(s && s.watch)) return;
  const chain = m.chain ?? null;
  if (chain == null) band = 0; else { if (chain !== lastChain) bandFlip = !bandFlip; band = bandFlip ? 1 : 0; }
  lastChain = chain;
  const e = { cn, n: ++seq, time, signal: m.signal, lname: m.signal.toLowerCase(), kind: m.kind, value: m.value, source: m.source || "",
              symbol: m.symbol ?? null, cause: m.cause ?? null, depth: m.depth | 0, chain, band };

}
let bandFlip = false;

function traceRow(e) {
  const tr = document.createElement("tr");
  tr.innerHTML = `<td class="n mono"></td><td class="mono"></td><td class="dt mono"></td><td class="mono cause-name"></td><td class="via mono"></td><td></td><td class="type"></td>`;
  if (e.band) tr.classList.add("b1");
  e.tr = tr; paintTraceRow(e);
  tr.onclick = () => {
    selTraceE?.tr.classList.remove("sel"); selTraceE = e; selChain = e.chain; tr.classList.add("sel");
    const s = signals.get(e.signal);
    if (s) { selectSignal(e.signal); if (!s.tr.hidden) s.tr.scrollIntoView({ block: "nearest" }); }
    if ($("#burst").checked) applyTraceFilter();

}

function paintTraceRow(e) {
  const c = e.tr.children;
  c[0].textContent = e.n; c[1].textContent = fmtTime(e);
  c[3].textContent = (e.depth > 0 ? "↳ " : "") + e.signal;
  c[3].style.paddingLeft = e.depth > 0 ? (6 + Math.min(e.depth, 8) * 10) + "px" : "";
  c[3].title = e.signal + (e.chain != null ? `\nburst ${e.chain} · depth ${e.depth}` : "");
  c[4].textContent = e.symbol || ""; c[4].title = e.symbol ? (e.cause ? `${e.symbol}\ntriggered by ${e.cause}` : e.symbol) : "";
  c[5].className = valClass(e.kind, e.value); c[5].textContent = fmt(e.kind, e.value); c[6].textContent = e.source;
}

function flushTrace() {
  rafQueued = false;

  const tb = $("#trace tbody"), frag = document.createDocumentFragment(), { q, fset, burst } = traceFilterState();
  let prev = lastShown();
  for (const e of pending) {
    const tr = traceRow(e);
    if (traceVisible(e, q, fset, burst)) { tr.children[2].textContent = fmtDelta(e, prev); prev = e; }
    else tr.hidden = true;

}

function updateTraceCount() {

  $("#st-trace").textContent = `${trace.length} in trace`;
}

function rerenderValues() {
  for (const s of signals.values()) paintValue(s);
  trace.forEach(e => paintTraceRow(e));
}

function clearTrace() {
  trace = []; seq = 0; firstTime = null; pending = []; selTraceE = null; selChain = null; lastChain = undefined;
  $("#trace tbody").replaceChildren(); $("#traceempty").hidden = false; updateTraceCount();
  wave?.clear(); waveBuf = [];
}

function saveTrace() {
  const head = `OpenVP trace · slot ${slot} · ${$("#prog").textContent}\n#\tTime\tDelta\tSignal\tType\tValue\tSource\tVia\tCause\tDepth\tChain\n`;
  const body = trace.map((e, i) => [e.n, fmtTime(e), fmtDelta(e, trace[i - 1]), e.signal, e.kind, fmt(e.kind, e.value), e.source,

// ---------------------------------------------------------------- step-through

const stepKey = () => "breaks." + slot;

async function stepPost(path, body) {
  try {
    const st = await api(`/api/slots/${slot}/step${path}`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body || {}) });
    onStep(st);
  } catch (e) { msg(e.message, true); }
}

function pushBreaks() {
  const names = [...signals.values()].filter(s => s.brk).map(s => s.name);
  store.set(stepKey(), names);
  stepPost("", { breakSignals: names });
}

function setBreak(s, on) {
  s.brk = on; if (s.bchk) s.bchk.checked = on;
  applyFilter(); pushBreaks();
}

function toggleStepMode() {
  if (!step.enabled && step.onlyBreakSignals && ![...signals.values()].some(s => s.brk))
    msg("Break on is set to marked signals but none are marked: tick ⏸ next to a signal, or press F9 on it.", true);
  stepPost("", { enabled: !step.enabled });
}

// State from the server: on connect, after every change, and whenever the program pauses or resumes.
function onStep(st) {
  if (st.slot != null && st.slot !== slot) return;
  // HTTP replies and WebSocket pushes can arrive out of order: keep only the newest state.
  if (st.version != null && st.version < stepVersion) return;
  stepVersion = st.version ?? stepVersion;
  const wasPausedOn = step.paused && step.paused.step;
  step = { enabled: st.enabled, onlyBreakSignals: st.onlyBreakSignals, breakSignals: new Set(st.breakSignals || []), paused: st.paused };

  // First state after connecting: if the server has no break list (e.g. it restarted) restore ours.
  if (!stepSynced) {
    stepSynced = true;
    const local = store.get(stepKey(), []);
    if (!step.breakSignals.size && local.length) {
      step.breakSignals = new Set(local);
      stepPost("", { breakSignals: local });
    }
  }
  store.set(stepKey(), [...step.breakSignals]);
  for (const s of signals.values()) {
    const b = step.breakSignals.has(s.name);
    if (b !== s.brk) { s.brk = b; if (s.bchk) s.bchk.checked = b; }
  }
  const p = step.paused;
  if (p && !stepLog.some(h => h.step === p.step)) {
    let cn = null;
    for (let i = changes.length - 1; i >= 0 && i >= changes.length - 500; i--)
      if (changes[i].signal === p.signal) { cn = changes[i].cn; break; }
    if (cn != null && stepLog.length && stepLog[stepLog.length - 1].cn >= cn) cn = null; // that change belongs to an earlier step
    stepLog.push({ step: p.step, signal: p.signal, kind: p.kind, value: p.value, source: p.source, cn });
    if (stepLog.length > 5000) { stepLog.shift(); if (view != null) view = Math.max(0, view - 1); }
  }
  if (!step.enabled && view != null) setView(null);
  applyFilter();
  $("#bmode").value = step.onlyBreakSignals ? "marked" : "all";
  renderStep(wasPausedOn !== (step.paused && step.paused.step));
}

function renderStep(newPause) {
  const p = step.paused;
  document.body.classList.toggle("stepping", step.enabled);
  $("#stepmode").classList.toggle("step-on", step.enabled);
  $("#stepmode").textContent = step.enabled ? "⏸ Step: on" : "⏸ Step";
  for (const id of ["#stepnext", "#stepnext2"]) $(id).disabled = !p && view == null;
  for (const id of ["#stepback", "#stepback2"]) $(id).disabled = !step.enabled || backIndex() < 0;
  for (const id of ["#steprun", "#steprun2"]) $(id).disabled = !step.enabled;
  const bar = $("#stepbar");
  bar.classList.toggle("off", !step.enabled);
  bar.classList.toggle("paused", !!p && view == null);
  bar.classList.toggle("history", view != null);

  const what = $("#stepwhat");
  if (view != null) {
    const h = stepLog[view];
    what.replaceChildren(
      document.createTextNode(`⏪ Looking back at step ${h.step} (${view + 1} of ${stepLog.length}): `),
      Object.assign(document.createElement("b"), { className: "mono", textContent: h.signal }),
      document.createTextNode(" → "),
      Object.assign(document.createElement("span"), { className: valClass(h.kind, h.value), textContent: fmt(h.kind, h.value) }),
      document.createTextNode(`  (${h.source || "logic"}) — values shown as they were then (dotted = different now). ` +
        (p ? `The program is still paused at step ${p.step}; Next ▶| walks forward to it.` : "Next ▶| walks forward to now.")));
    what.title = what.textContent;
  } else if (p) {
    what.replaceChildren(
      document.createTextNode(`⏸ Paused at step ${p.step}: `),
      Object.assign(document.createElement("b"), { className: "mono", textContent: p.signal }),
      document.createTextNode(" → "),
      Object.assign(document.createElement("span"), { className: valClass(p.kind, p.value), textContent: fmt(p.kind, p.value) }),
      document.createTextNode(`  (${p.source || "logic"}) — the new value is set; logic driven by it runs when you press Next.`));
    what.title = what.textContent;
  } else if (step.enabled) {
    const n = step.breakSignals.size;
    what.textContent = step.onlyBreakSignals
      ? `▶ Running — will pause on the next change to ${n ? `${n} marked signal${n === 1 ? "" : "s"}` : "a marked signal (none marked yet)"}.`
      : "▶ Running — will pause on the next signal change. Drive an input (panel, force bar) to start stepping.";

  // Highlight the paused signal in both lists.

  if (view != null) {

  } else if (p) {
    const s = signals.get(p.signal);

  updateWaveCursor();
}

// The stepLog entry that counts as "now": the live pause if there is one, else just past the end.

$("#stepmode").onclick = toggleStepMode;
$("#stepnext").onclick = $("#stepnext2").onclick = stepNext;
$("#stepback").onclick = $("#stepback2").onclick = stepBack;
$("#steprun").onclick = $("#steprun2").onclick = () => stepPost("/run");

// ---------------------------------------------------------------- waveform panel

let wave = null, waveBuf = [], laneTimer = null;
const waveOk = !!(window.WaveView && typeof window.WaveView.create === "function");
function waveLanes() { return [...signals.values()].filter(s => s.watch).map(s => ({ name: s.name, kind: s.kind, value: s.value })); }
function scheduleLanes() { if (!wave) return; clearTimeout(laneTimer); laneTimer = setTimeout(() => wave && wave.setSignals(waveLanes()), 30); }

}

// ---------------------------------------------------------------- forcing signals

async function force(name, value) {
  try {
    await api(`/api/slots/${slot}/signals`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, value }) });
    msg(step.paused ? `Queued: ${name} changes once the paused step is released (Next).` : "");
  } catch (e) { msg(e.message, true); }
}
// Pulse is one request: the server drives high then low back to back on the slot thread, with nothing in
// between, as a processor's debugger does. (Two requests, or a held pulse, leave a gap that short program
// timers, such as a Stepper's 0.1 s first step, can fall into.)
async function pulse(name) {
  try {
    await api(`/api/slots/${slot}/signals`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, pulse: true }) });
    msg(step.paused ? `Queued: ${name} pulses once the paused step is released (Next).` : "");
  } catch (e) { msg(e.message, true); }
}

function forceTarget() {
  const name = $("#fname").value.trim();
  const s = signals.get(name);
  if (!s) { msg(name ? `Unknown signal '${name}'` : "Pick a signal first", true); return null; }
  return s;
}
function msg(t, bad) { $("#fmsg").textContent = t; $("#fmsg").style.color = bad ? "var(--err)" : ""; }

$("#fset").onclick = () => {
  const s = forceTarget(); if (!s) return;
  try { force(s.name, s.kind === "Digital" && !$("#fval").value.trim() ? 1 : parseForce(s.kind, $("#fval").value)); }
  catch (e) { msg(e.message, true); }
};
$("#fclear").onclick = () => { const s = forceTarget(); if (s) force(s.name, s.kind === "Digital" ? 0 : s.kind === "Analog" ? 0 : ""); };
$("#fpulse").onclick = () => { const s = forceTarget(); if (!s) return; if (s.kind !== "Digital") return msg("Pulse is for digital signals", true); pulse(s.name); };
$("#fval").onkeydown = e => { if (e.key === "Enter") $("#fset").click(); };
$("#fname").onchange = () => { if (signals.has($("#fname").value)) selectSignal($("#fname").value); };

// ---------------------------------------------------------------- drives / driven by

function showRelated(name, dir) {
  const e = graph && graph.bySig.get(name);
  const syms = e ? (dir === "drivers" ? e.out : e.in) : [];
  $("#reltitle").textContent = (dir === "drivers" ? "Driven by" : "Drives") + " · " + name + ` (${syms.length} symbol${syms.length === 1 ? "" : "s"})`;
  const body = $("#relbody"), frag = document.createDocumentFragment();
  if (!syms.length) { const d = document.createElement("div"); d.className = "sym"; d.style.color = "var(--muted)"; d.textContent = dir === "drivers" ? "Nothing in the program drives this signal (it is an input or a constant)." : "This signal doesn't feed anything."; frag.appendChild(d); }
  for (const sym of syms.slice(0, 200)) {
    const d = document.createElement("div"); d.className = "sym";
    const head = document.createElement("div");
    head.innerHTML = '<b></b><span class="path mono"></span>'; head.firstChild.textContent = sym.name; head.querySelector(".path").textContent = sym.path;
    if (sym.device) { const t = document.createElement("span"); t.className = "dev"; t.textContent = "device"; head.appendChild(t); }
    const chips = document.createElement("div"); chips.className = "chips";
    // what feeds the symbol (when listing drivers) or what it produces (when listing loads)
    const others = dir === "drivers" ? sym.inputs || [] : sym.outputs || [];
    const lab = document.createElement("span"); lab.style.color = "var(--muted)"; lab.textContent = dir === "drivers" ? "inputs:" : "outputs:"; chips.appendChild(lab);
    for (const n of others.slice(0, 60)) {
      const c = document.createElement("span"); c.className = "chip mono" + (n === name ? " me" : ""); c.textContent = n;
      const s = signals.get(n); if (s) c.title = `${s.kind} = ${fmt(s.kind, s.value)}`; else if (CONST_SIGS.has(n)) c.title = "constant";
      c.onclick = () => { if (signals.has(n)) revealSignal(n); }; chips.appendChild(c);
    }
    if (others.length > 60) { const more = document.createElement("span"); more.style.color = "var(--muted)"; more.textContent = `+${others.length - 60} more`; chips.appendChild(more); }
    d.append(head, chips); frag.appendChild(d);
  }
  body.replaceChildren(frag); $("#rel").hidden = false;
}
$("#relclose").onclick = () => { $("#rel").hidden = true; };

// ---------------------------------------------------------------- context menu

const KEEP = Symbol("keep");
function popMenu(x, y, items) {
  const m = $("#menu");
  m.replaceChildren(...items.map(([label, fn, cls]) => {
    if (label === "-") return document.createElement("hr");
    const d = document.createElement("div"); d.textContent = label; if (cls) d.className = cls;
    if (fn) d.onclick = ev => { if (fn() === KEEP) ev.stopPropagation(); else hideMenu(); };
    return d;
  }));
  m.style.display = "block";
  m.style.left = Math.max(0, Math.min(x, innerWidth - m.offsetWidth - 4)) + "px";
  m.style.top = Math.max(0, Math.min(y, innerHeight - m.offsetHeight - 4)) + "px";
}

function showMenu(x, y, s) {
  const items = [[s.name, null, "hd"]];
  if (s.kind === "Digital") items.push(["Set (1)", () => force(s.name, 1)], ["Clear (0)", () => force(s.name, 0)], ["Pulse", () => pulse(s.name)], ["Toggle", () => force(s.name, isHigh(s.value) ? 0 : 1)]);
  else if (s.kind === "Analog") items.push(["Set value…", () => { $("#fval").focus(); $("#fval").select(); }], ["Set to 0", () => force(s.name, 0)], ["Set to 65535", () => force(s.name, 65535)]);
  else items.push(["Send string…", () => { $("#fval").value = ""; $("#fval").focus(); }], ["Clear string", () => force(s.name, "")]);
  items.push(["-"], [s.brk ? "Don't break on this signal" : "Break on this signal ⏸", () => setBreak(s, !s.brk)],
             [s.watch ? "Uncheck for trace" : "Check for trace", () => { s.watch = !s.watch; s.chk.checked = s.watch; watchChanged(); }]);
  // watch groups
  items.push(["-"], ["Add to group ▸", () => { popMenu(x, y, [["Add " + s.name + " to…", null, "hd"],
      ...[...groups.keys()].map(g => [(groups.get(g).has(s.name) ? "✓ " : "") + g, () => addToGroup(g, s)]),
      ["New group…", () => { newGroup(s); }]]); return KEEP; }]);
  const mine = [...groups].filter(([, set]) => set.has(s.name)).map(([g]) => g);
  if (mine.length) items.push(["Remove from group" + (mine.length > 1 ? " ▸" : ` “${mine[0]}”`), mine.length === 1 ? () => removeFromGroup(mine[0], s)
    : () => { popMenu(x, y, [["Remove " + s.name + " from…", null, "hd"], ...mine.map(g => [g, () => removeFromGroup(g, s)])]); return KEEP; }]);
  if (graph) items.push(["-"], ["Show what drives this", () => showRelated(s.name, "drivers")], ["Show what this drives", () => showRelated(s.name, "loads")],
                        ["Show paths from here ▸", () => window.open(pathsUrl(s.name), "_blank", "noopener")]);
  items.push(["-"], ["Copy name", () => navigator.clipboard?.writeText(s.name)]);
  popMenu(x, y, items);
}
function hideMenu() { $("#menu").style.display = "none"; }
addEventListener("click", hideMenu); addEventListener("blur", hideMenu);
addEventListener("keydown", e => {
  if (e.key === "Escape") hideMenu();
  if (e.key === "F5" && e.ctrlKey) { e.preventDefault(); toggleStepMode(); return; }
  if (e.key === "F5") { e.preventDefault(); $("#stream").click(); }
  if (e.key === "F10") { e.preventDefault(); stepNext(); }
  if (e.key === "F7") { e.preventDefault(); stepBack(); }
  if (e.key === "F8") { e.preventDefault(); if (step.enabled) stepPost("/run"); }
  if (e.key === "F9") { e.preventDefault(); const s = signals.get(selected); if (s) setBreak(s, !s.brk); }
});

// ---------------------------------------------------------------- connection, slots, status

function connect() {
  ws?.close();
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  stepSynced = false; stepVersion = -1;
  const sock = ws = new WebSocket(`${proto}${location.host}/ws/trace?slot=${slot}`);
  sock.onopen = () => setConn(true);
  sock.onclose = () => { if (sock !== ws) return; setConn(false); setTimeout(() => { if (sock === ws) connect(); }, 2000); };
  sock.onmessage = ev => {
    // Each frame is a JSON array of events (a single object is accepted too).
    const data = JSON.parse(ev.data);
    for (const m of Array.isArray(data) ? data : [data]) {
      if (m.t === "trace") onTrace(m);
      else if (m.t === "step") onStep(m);
      else if (m.t === "log") {
        if (/Loaded|started|stopped|Unload/i.test(m.message)) { loadSlots(); scheduleRefresh(); }
        if (m.level === "Error") $("#st-msg").textContent = m.message;
      }
    }
  };
}
function setConn(ok) { $("#st-conn").innerHTML = `<i class="dot ${ok ? "ok" : "bad"}"></i>${ok ? "connected" : "reconnecting…"}`; }
function scheduleRefresh() { clearTimeout(refreshTimer); refreshTimer = setTimeout(loadSignals, 300); }

async function loadSlots() {
  const slots = await api("/api/slots").catch(() => []);
  const sel = $("#slot");
  sel.replaceChildren(...slots.map(s => {
    const o = document.createElement("option"); o.value = s.number;
    o.textContent = `Slot ${pad(s.number)}${s.program ? " · " + s.program : ""}`;
    return o;
  }));
  sel.value = slot;
  const s = slots.find(x => x.number === slot);
  $("#prog").textContent = s?.file ? `${s.file} · ${s.kind}` : "no program";
  currentState = s ? s.state : "—";
  $("#st-state").textContent = step.paused ? "Paused (step)" : step.enabled ? "Stepping" : currentState;
  document.title = `Debugger · slot ${slot}`;
}

function switchSlot(n) {
  slot = n; history.replaceState(null, "", `?slot=${n}`);
  selected = null; $("#fname").value = ""; $("#fval").value = "";
  step = { enabled: false, onlyBreakSignals: false, breakSignals: new Set(), paused: null };
  changes = []; stepLog = []; view = null; viewVals = null; renderStep(false);
  graph = null; tree = null; litFolders.clear(); glowQ.clear(); $("#rel").hidden = true; $("#pathslink").href = pathsUrl();
  collapsedMap = store.get(collapsedKey(), {}) || {};
  loadGroups();
  clearTrace(); loadSlots(); loadSignals(); connect();
  if (wave) wave.setSignals([]);
}

$("#slot").onchange = e => switchSlot(Number(e.target.value));
$("#stream").onclick = () => { streaming = !streaming; $("#stream").classList.toggle("on", streaming); $("#stream").textContent = streaming ? "● Stream" : "○ Stream"; };
$("#clear").onclick = clearTrace;
$("#save").onclick = saveTrace;
$("#search").oninput = debounce(applyFilter, 80); $("#kfilter").onchange = applyFilter; $("#onlychecked").onchange = applyFilter; $("#activeonly").onchange = applyFilter;
$("#tsearch").oninput = debounce(applyTraceFilter, 80);
$("#burst").onchange = applyTraceFilter;
$("#follow").onchange = e => { followMode = e.target.value; store.set("follow", followMode); applyTraceFilter(); };
$("#resetact").onclick = resetActivity;
$("#fold").onclick = () => setAllFolders(true); $("#unfold").onclick = () => setAllFolders(false);
document.querySelectorAll("#viewseg button").forEach(b => b.onclick = () => setViewMode(b.dataset.v));
function checkVisible(v) { for (const s of signals.values()) if (s.tr && !s.tr.hidden) { s.watch = v; s.chk.checked = v; } watchChanged(); }
$("#checkall").onclick = () => checkVisible(true); $("#checknone").onclick = () => checkVisible(false);
function setSort(by) {
  if (sortBy === by && (by === "name" || by === "kind")) sortDir = -sortDir;
  else { sortBy = by; sortDir = by === "recent" || by === "count" ? -1 : 1; }
  store.set("sort", sortBy); store.set("sortdir", sortDir);
  layout(); syncSortUi(); applyFilter();
}
document.querySelectorAll("#sigs th.sortable").forEach(th => th.onclick = () => setSort(th.dataset.sort));
$("#sortsel").onchange = e => { const v = e.target.value; if (v !== sortBy) { sortBy = v; sortDir = v === "recent" || v === "count" ? -1 : 1; store.set("sort", sortBy); store.set("sortdir", sortDir); layout(); syncSortUi(); applyFilter(); } };

// splitter
(() => {
  const sp = $("#splitter"), panes = $("#panes");
  const saved = store.get("split", null); if (saved) panes.style.setProperty("--left", saved);
  sp.onpointerdown = e => {
    sp.setPointerCapture(e.pointerId); sp.classList.add("drag");
    sp.onpointermove = ev => {
      const r = panes.getBoundingClientRect();
      const pct = Math.max(20, Math.min(80, (ev.clientX - r.left) * 100 / r.width)).toFixed(1) + "%";
      panes.style.setProperty("--left", pct); store.set("split", pct);
    };
    sp.onpointerup = () => { sp.classList.remove("drag"); sp.onpointermove = null; };
  };
})();

document.querySelectorAll("#viewseg button").forEach(b => b.classList.toggle("on", b.dataset.v === viewMode));
$("#foldbtns").hidden = viewMode !== "tree";
syncSortUi();
switchSlot(slot);
if (store.get("waveopen", false)) setWaveOpen(true);
setInterval(loadSlots, 3000);
</script>
</body>
</html>
