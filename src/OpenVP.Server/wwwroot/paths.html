<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="openvp-theme.css">
<script src="openvp-theme.js"></script>
<title>OpenVP Paths</title>
<style>
  /* Same palette as debugger.html. */
  :root { --bg:#0f1216; --pane:#151a20; --head:#1b2129; --line:#29303a; --text:#e6e9ee; --muted:#8b95a3; --accent:#4c8dff;
          --sel:#22344f; --hi:#7fe0b1; --lo:#6b7480; --ana:#f2cf7a; --ser:#9ecbff; --err:#e05252;
          --neon:#19e6ff; --loop:#ff3dcb; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; font:13px/1.35 system-ui, sans-serif; background:var(--bg); color:var(--text);
         display:flex; flex-direction:column; overflow:hidden; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size:12px; }
  button, input, select { font:inherit; color:var(--text); background:var(--input); border:1px solid var(--line); border-radius:4px; padding:3px 8px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  button.on { background:var(--active); border-color:var(--neon); color:var(--text); }
  button:disabled { opacity:.45; cursor:default; }
  label { display:inline-flex; align-items:center; gap:4px; color:var(--muted); }
  a { color:var(--accent); text-decoration:none; } a:hover { text-decoration:underline; }
  .muted { color:var(--muted); }

  .title { display:flex; align-items:center; gap:10px; padding:6px 10px; border-bottom:1px solid var(--line); background:var(--head); flex-wrap:wrap; }
  .title b { font-size:14px; }
  .toolbar { display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; padding:6px 10px; border-bottom:1px solid var(--line); background:var(--pane); }
  .group { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .sep { width:1px; height:20px; background:var(--line); }
  .dot { display:inline-block; width:8px; height:8px; border-radius:50%; background:var(--lo); margin-right:5px; vertical-align:middle; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--err); }

  /* start-signal picker with autocomplete */
  .pick { position:relative; }
  .pick input { width:230px; }
  #sugg { position:absolute; left:0; top:100%; z-index:20; min-width:100%; max-height:280px; overflow:auto; background:var(--head);
          border:1px solid var(--line); border-radius:4px; margin-top:2px; display:none; }
  #sugg div { padding:3px 8px; cursor:pointer; white-space:nowrap; font-size:12px; }
  #sugg div:hover, #sugg div.act { background:var(--sel); }
  #sugg i { color:var(--muted); font-style:normal; margin-left:8px; font-size:11px; }
  #depth { width:110px; padding:0; accent-color:var(--neon); }

  .main { flex:1; min-height:0; display:grid; grid-template-columns: 1fr 300px; }
  :root[data-theme="light"] .stage { --text:#e6e9ee; --muted:#8b95a3; --ana:#f2cf7a; --err:#e05252; --neon:#19e6ff; --loop:#ff3dcb; --line:#29303a; --hi:#7fe0b1; --lo:#6b7480; --ser:#9ecbff; --head:#1b2129; --pane:#151a20; }
  .stage { position:relative; min-height:0; min-width:0; overflow:hidden; background:radial-gradient(ellipse at center, #121820 0%, #0b0e12 100%); }
  canvas { position:absolute; inset:0; width:100%; height:100%; touch-action:none; cursor:grab; display:block; }
  canvas.drag { cursor:grabbing; } canvas.hand { cursor:pointer; }
  #hud { position:absolute; left:8px; bottom:6px; right:8px; color:var(--muted); font-size:11px; pointer-events:none; text-shadow:0 0 4px #000; }
  #hud .warn { color:var(--ana); } #hud .bad { color:var(--err); }
  #legend { position:absolute; right:8px; top:6px; font-size:11px; color:var(--muted); pointer-events:none; text-align:right; text-shadow:0 0 4px #000; }
  #legend i { display:inline-block; width:16px; height:0; border-top:2px solid; vertical-align:middle; margin:0 4px 0 10px; }
  #tip { position:absolute; z-index:5; pointer-events:none; display:none; max-width:320px; background:#1b2129ee; border:1px solid var(--line);
         border-radius:6px; padding:6px 9px; font-size:12px; box-shadow:0 4px 14px #0008; }
  #tip b { color:#fff; } #tip .k { color:var(--muted); }
  #empty { position:absolute; inset:0; display:none; place-items:center; text-align:center; color:var(--muted); padding:24px; pointer-events:none; }
  /* loading / error state: a card in the middle while there is no maze yet, a small pill on top of an existing one */
  #status { position:absolute; z-index:6; left:50%; top:50%; transform:translate(-50%,-50%); max-width:min(440px, calc(100% - 32px)); text-align:center;
            background:#151a20ee; border:1px solid var(--line); border-radius:8px; padding:14px 20px; color:var(--text); box-shadow:0 6px 24px #000a; }
  #status.pill { top:12px; transform:translate(-50%,0); padding:5px 12px; border-radius:14px; font-size:12px; color:var(--muted); }
  #status.pill .bar { display:none; }
  #status.err { border-color:#7a2f2f; }
  #status.err #stMsg { color:#ff9a9a; }
  #status .bar { height:3px; width:220px; max-width:100%; margin:10px auto 2px; background:#232b35; border-radius:2px; overflow:hidden; }
  #status .bar i { display:block; height:100%; width:35%; background:var(--neon); border-radius:2px; animation:slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { margin-left:-35%; } 100% { margin-left:100%; } }
  #status button { margin-top:10px; }

  .side { border-left:1px solid var(--line); background:var(--pane); min-height:0; overflow:auto; display:flex; flex-direction:column; }
  .side h2 { margin:0; padding:5px 8px; font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted);
             background:var(--head); border-bottom:1px solid var(--line); position:sticky; top:0; display:flex; gap:8px; align-items:center; }
  .side h2 .grow { flex:1; }
  .list { font-size:12px; }
  .list .row { display:grid; grid-template-columns: 28px 1fr auto; gap:6px; padding:3px 8px; border-bottom:1px solid var(--line); cursor:pointer; align-items:baseline; }
  .list .row:hover { background:var(--sel); }
  .list .row .d { color:var(--muted); text-align:right; }
  .list .row .s { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .list .row .s small { color:var(--muted); display:block; font-size:10.5px; overflow:hidden; text-overflow:ellipsis; }
  .list .row.osc { background:var(--err-bg); } .list .row.osc .v { color:var(--err-fg); }
  .v.hi { color:var(--neon); }
  .none { padding:10px 8px; color:var(--muted); font-size:12px; }
  #loops { max-height:34%; overflow:auto; flex:none; } #burst { flex:1; min-height:120px; overflow:auto; }

  @media (max-width: 800px) {
    body { overflow:auto; height:auto; min-height:100%; }
    .main { display:block; flex:none; }
    .stage { height:62vh; min-height:340px; }
    .side { border-left:0; border-top:1px solid var(--line); }
    #loops, #burst { max-height:none; }
    .pick input { width:180px; }
  }
</style>
</head>
<body>
<div class="title">
  <b>Paths</b>
  <select id="slot" title="Program slot"></select>
  <span id="prog" class="muted mono"></span>
  <span style="flex:1"></span>
  <span id="conn" class="muted"><i class="dot"></i>…</span>
  <button class="theme-btn" data-theme-toggle></button>
  <a id="dbglink" href="debugger.html" title="Open the debugger for this slot">&larr; Debugger</a>
  <a href="/" title="Back to the main page">Console</a>
  <a href="help.html#paths" target="openvp-help" title="What every button on this page does">Help</a>
</div>

<div class="toolbar">
  <div class="group">
    <span class="pick">
      <input id="start" class="mono" placeholder="start signal (search)…" title="Type part of a signal name and pick one. The map is drawn outwards from it." autocomplete="off" spellcheck="false">
      <div id="sugg"></div>
    </span>
    <select id="dir" title="Direction of the search">
      <option value="fwd">What does it drive? &rarr;</option>
      <option value="back">&larr; What drives it?</option>
    </select>
    <label title="How many signal-to-signal hops to follow from the start signal">Depth
      <input id="depth" type="range" min="1" max="30" value="8"><b id="depthv" class="mono" style="color:var(--text);min-width:18px">8</b></label>
    <label title="Draw the whole program instead of just the cone around the start signal"><input id="whole" type="checkbox"> whole program</label>
    <label title="When a new burst starts on a signal that is not in view, re-centre the maze on it"><input id="follow" type="checkbox"> follow live changes</label>
  </div>
  <span class="sep"></span>
  <div class="group">
    <button id="fit" title="Fit the maze to the window">Fit</button>
    <button id="pulse" title="Pulse the start signal (press the button). Double-click a digital signal does the same.">Pulse start</button>
  </div>
  <span class="sep"></span>
  <div class="group" title="Slow motion: queue incoming events and replay them slower">
    <span class="muted">Speed</span>
    <button class="spd on" data-s="1" title="Show changes at normal speed">1&times;</button><button class="spd" data-s="0.25" title="Slow motion: play changes back 4 times slower">0.25&times;</button><button class="spd" data-s="0.1" title="Slow motion: play changes back 10 times slower">0.1&times;</button>
    <button id="replay" title="Play the last burst again" disabled>&#8635; Replay last burst</button>
    <button id="skip" title="Drop the queued events and jump to live" style="display:none">Skip queue</button>
  </div>
</div>

<div class="main">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div id="empty"></div>
    <div id="status" class="card" role="status"><div id="stMsg">Loading wiring…</div><div class="bar"><i id="stBar"></i></div><button id="stRetry" title="Try loading the wiring again" style="display:none">Retry</button></div>
    <div id="legend"><i style="border-color:#4a5360"></i>wire<i style="border-color:#19e6ff"></i>signal path<i style="border-color:#ff3dcb"></i>loop</div>
    <div id="hud"></div>
    <div id="tip"></div>
  </div>
  <aside class="side">
    <div id="loops">
      <h2>Loops &amp; oscillations</h2>
      <div class="list" id="loopsList"></div>
    </div>
    <div id="burst">
      <h2><span class="grow">Last burst</span><span id="burstInfo" class="muted" style="text-transform:none;letter-spacing:0"></span></h2>
      <div class="list" id="burstList"></div>
    </div>
  </aside>
</div>

<script src="openvp-auth.js"></script>
<script>
openvpAuth.init();
const $ = s => document.querySelector(s);
const T0 = performance.now();

// ---------------------------------------------------------------- tunables
const HOP_MS = 150;          // time for the pulse to cross one signal -> symbol -> signal hop
const FADE_MS = 2500;        // how long a lit node / edge takes to fade out
const FAN = 12;              // children drawn per node before collapsing the rest into "+K more" (cone view only)
const MAX_NODES = 80000;     // hard cap on drawn nodes (breadth-first, so what is drawn stays connected)
const COL_W = 190, ROW_H = 40;
const OSC_CHAIN = 6;         // changes of one signal inside one burst that count as oscillation
const OSC_RATE = 20;         // changes per second that count as oscillation
const OSC_HOLD = 6000;       // how long an oscillation stays flagged after the last change
const QMAX = 30000;          // received trace events waiting for playback; older ones are dropped beyond this
const SCHED_MAX = 6000;      // events waiting for their hop time
const LIT_N_FULL = 700, LIT_E_FULL = 1500;   // lit nodes / wires that get the full glow treatment per frame
const SLICE_MS = 8;          // main-thread budget per frame for static drawing and event playback

const COL = {
  edge: "#3a424d", edgeBack: "#5b3350", node: "#2c333d", nodeText: "#8a94a2", symText: "#9aa4b2",
  hi: "#19e6ff", lo: "#2aa3b8", ana: "#ffd24d", ser: "#8fb4ff", loop: "#ff3dcb", osc: "#ff4040", dev: "#7a6bb0"
};

// ---------------------------------------------------------------- state
let slot = Number(new URLSearchParams(location.search).get("slot")) || 1;
let startSig = new URLSearchParams(location.search).get("signal") || "";
let G = null;                       // program graph (typed arrays, see onGraph)
let pendingG = null;                // a newly loaded graph waiting for its first view; the old maze stays up meanwhile
let V = null;                       // current view (the drawn sub-graph), typed arrays from the worker
let expanded = new Set();           // "+K more" codes that were opened (signal id, or nSig + symbol id)
let vals = new Map();               // signal name -> current value (from /signals and trace events)
let ws = null;
const cfg = { dir: "fwd", depth: 8, whole: false, follow: false, speed: 1 };
const T = { x: 0, y: 0, k: 1 };     // pan / zoom (screen = world * k + xy)
const timing = { t0: T0 };

// live-animation state (all times are performance.now() ms)
const litN = new Map();             // node index -> { t, high, kind, n, ring }
const litE = new Map();             // edge index -> { t, dur, high, kind }
const hiSet = new Set();            // view node indices of digital signals that are steadily high
const sched = [];                   // events waiting for their hop time: { at, arr, e, n, hop }
let Q = [], qh = 0;                 // received events waiting for playback (array + head index = O(1) shift)
let droppedEv = 0;
const chainBase = new Map();        // chain -> time its first event played
const chainArr = new Map();         // chain|signal -> time that signal's light arrives
const chainCnt = new Map();         // chain|signal -> number of changes in this chain
const rate = new Map();             // signal -> { t0, c }: changes in the current one-second window
const osc = new Map();              // signal -> { t, n, reason }
const bursts = new Map();           // chain -> [events] (recent chains only)
let lastBurst = null, lastFollow = 0, playClock = 0, lastFrame = 0, flash = null, replaySeq = 0;

const store = {
  get(k, d) { try { const v = localStorage.getItem("openvp.paths." + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem("openvp.paths." + k, JSON.stringify(v)); } catch { } }
};
async function api(path, init) {
  const r = await fetch(path, init);
  if (openvpAuth.check(r)) throw new Error("Log in with the access key first.");
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(body.error || body || r.statusText);
  return body;
}
const pad = (n, w = 2) => String(n).padStart(w, "0");
const isHigh = v => v === true || v === 1 || v === "1" || v === "True" || v === "true";
const KINDS = ["Digital", "Analog", "Serial"];
function fmt(kind, v) {
  if (v === undefined) return "?";
  if (kind === "Digital") return isHigh(v) ? "1" : "0";
  if (kind === "Analog") return (Number(v) || 0) + "d";
  const s = v == null ? "" : String(v);
  return '"' + s.replace(/[\x00-\x1F\x7F-\xFF\\]/g, c => "\\x" + c.charCodeAt(0).toString(16).toUpperCase().padStart(2, "0")).slice(0, 40) + '"';
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
function setHud(html) { $("#hud").innerHTML = html; }
const nf = n => Number(n).toLocaleString("en-US");

// ---------------------------------------------------------------- worker: fetch, parse, index, build, lay out
// Everything heavy happens in here (an inline Blob worker). The function is written so it also runs on the page itself
// (cooperatively time-sliced) if a worker cannot be created.
function workerMain(S) {
  const now = () => performance.now();
  const yq = [], mc = new MessageChannel();
  mc.port1.onmessage = () => { const r = yq.shift(); if (r) r(); };
  const yieldNow = () => new Promise(r => { yq.push(r); mc.port2.postMessage(0); });
  const CANCEL = { cancelled: true };
  const slicer = isStale => { let last = now(); return async () => { if (now() - last > 10) { await yieldNow(); if (isStale()) throw CANCEL; last = now(); } }; };
  const abs = () => performance.timeOrigin + now();
  let G = null, latestView = 0, latestLoad = 0, gseq = 0;
  const isC = n => !n || n === "0" || n === "1";

  async function load(m) {
    const id = m.id; latestLoad = id;
    const stale = () => latestLoad !== id, sl = slicer(stale);
    const post = (o, tr) => S.postMessage(Object.assign({ id }, o), tr || []);
    try {
      post({ t: "prog", stage: "fetch", bytes: 0 });
      const res = await fetch(m.url, { credentials: "same-origin", headers: { accept: "application/json" } });
      if (res.status === 401) { post({ t: "err", auth: true, message: "Log in with the access key first." }); return; }
      if (!res.ok) {
        let msg = res.statusText || ("HTTP " + res.status);
        try { const j = await res.json(); if (j && j.error) msg = j.error; } catch { }
        post({ t: "err", status: res.status, message: msg }); return;
      }
      const chunks = []; let got = 0, lastP = 0;
      if (res.body && res.body.getReader) {
        const rd = res.body.getReader();
        for (;;) {
          const { done, value } = await rd.read(); if (done) break;
          chunks.push(value); got += value.length;
          if (now() - lastP > 120) { lastP = now(); post({ t: "prog", stage: "fetch", bytes: got }); if (stale()) { try { rd.cancel(); } catch { } return; } }
        }
      } else { const b = new Uint8Array(await res.arrayBuffer()); chunks.push(b); got = b.length; }
      if (stale()) return;
      const tBytes = abs();
      post({ t: "prog", stage: "parse", bytes: got, ts: tBytes });
      const text = await new Blob(chunks).text();
      if (stale()) return;
      let h = 2166136261 >>> 0;
      for (let i = 0, n = text.length; i < n; i++) h = Math.imul(h ^ text.charCodeAt(i), 16777619);
      const sig = (h >>> 0).toString(36) + ":" + text.length + ":" + m.slot;
      if (!m.force && G && G.sig === sig) { post({ t: "same", ts: abs() }); return; }
      await yieldNow(); if (stale()) return;
      const raw = JSON.parse(text);
      post({ t: "prog", stage: "index", symbols: (raw.symbols || []).length });
      await yieldNow(); if (stale()) return;

      // ---- index: integer ids + CSR adjacency
      const rs = raw.signals || [], ry = raw.symbols || [];
      const sigMap = new Map(), sigNames = [], kinds = [];
      const kc = k => k === "Analog" ? 1 : k === "Serial" ? 2 : 0;
      const sidOf = n => { let i = sigMap.get(n); if (i === undefined) { i = sigNames.length; sigMap.set(n, i); sigNames.push(String(n).replace(/[\r\n]/g, " ")); kinds.push(0); } return i; };
      for (let i = 0; i < rs.length; i++) { const s = rs[i]; if (isC(s.name)) continue; const j = sidOf(s.name); if (s.kind) kinds[j] = kc(s.kind); if ((i & 8191) === 0) await sl(); }
      const nSym = ry.length;
      const symInS = new Int32Array(nSym + 1), symOutS = new Int32Array(nSym + 1);
      const inL = [], outL = [], symNames = new Array(nSym), symPaths = new Array(nSym), symGroups = new Array(nSym), symIds = new Array(nSym);
      const symDev = new Uint8Array(nSym);
      const addPins = (arr, dst) => {
        if (!arr) return;
        const start = dst.length; let set = null;
        for (let j = 0; j < arr.length; j++) {
          const n = arr[j]; if (isC(n)) continue;
          const id2 = sidOf(n);
          if (dst.length - start < 32) { let dup = false; for (let k = start; k < dst.length; k++) if (dst[k] === id2) { dup = true; break; } if (dup) continue; }
          else { if (!set) set = new Set(dst.slice(start)); if (set.has(id2)) continue; set.add(id2); }
          dst.push(id2);
        }
      };
      const clean = s => String(s == null ? "" : s).replace(/[\r\n]/g, " ");
      for (let i = 0; i < nSym; i++) {
        const y = ry[i];
        addPins(y.inputs, inL); symInS[i + 1] = inL.length;
        addPins(y.outputs, outL); symOutS[i + 1] = outL.length;
        symIds[i] = clean(y.id); symNames[i] = clean(y.name || y.id); symPaths[i] = clean(y.path || y.id); symGroups[i] = clean(y.group);
        symDev[i] = y.device ? 1 : 0;
        if ((i & 1023) === 0) await sl();
      }
      const nSig = sigNames.length;
      const symIn = Int32Array.from(inL), symOut = Int32Array.from(outL);
      const invert = (S1, L1) => {
        const cnt = new Int32Array(nSig + 1);
        for (let p = 0; p < L1.length; p++) cnt[L1[p] + 1]++;
        for (let i = 0; i < nSig; i++) cnt[i + 1] += cnt[i];
        const cur = cnt.slice(0, nSig), out = new Int32Array(L1.length);
        for (let y = 0; y < nSym; y++) for (let p = S1[y]; p < S1[y + 1]; p++) out[cur[L1[p]]++] = y;
        return [cnt, out];
      };
      const [sigRdS, sigRd] = invert(symInS, symIn), [sigDrS, sigDr] = invert(symOutS, symOut);
      G = { id: ++gseq, sig, nSig, nSym, symDev, symInS, symIn, symOutS, symOut, sigRdS, sigRd, sigDrS, sigDr, sigKind: Uint8Array.from(kinds),
            sigNames, symNames };
      if (stale()) return;
      post({
        t: "graph", gid: G.id, sig, ts: abs(), tBytes, kind: raw.kind || "", nSig, nSym, nPins: inL.length + outL.length,
        sigNames: sigNames.join("\n"), symNames: symNames.join("\n"), symPaths: symPaths.join("\n"), symGroups: symGroups.join("\n"), symIds: symIds.join("\n"),
        sigKind: G.sigKind, symDev, symInS, symIn, symOutS, symOut, sigRdS, sigRd, sigDrS, sigDr
      });
    } catch (e) {
      if (e === CANCEL) return;
      post({ t: "err", message: (e && e.message) || String(e) });
    }
  }

  async function view(m) {
    const id = m.id; latestView = id;
    const post = (o, tr) => S.postMessage(Object.assign({ id }, o), tr || []);
    const g = G;
    if (!g || g.id !== m.gid) { post({ t: "err", message: "graph not ready", stale: true }); return; }
    const stale = () => latestView !== id, sl = slicer(stale);
    try {
      const tStart = now();
      const COL_W = m.colW, ROW_H = m.rowH;
      const { nSig, nSym } = g;
      const back = m.dir === "back", whole = !!m.whole, limit = whole ? Infinity : m.depth, cap = m.maxNodes, fan = m.fan;
      const expanded = new Set(m.expanded);
      const sigNode = new Int32Array(nSig).fill(-1), symNode = new Int32Array(nSym).fill(-1), symDone = new Uint8Array(nSym);
      const nType = [], nRef = [], nK = [], nCode = [], nBey = [], eA = [], eB = [];
      let truncated = false, hidden = 0;
      const addNode = (type, ref, k, code) => {
        if (nType.length >= cap) { truncated = true; return -1; }

  let at = now;
  if (chain != null) {
    let base = chainBase.get(chain); if (base == null) { chainBase.set(chain, now); trimMap(chainBase, 400); }
    if (cause) { const ca = chainArr.get(chain + "|" + cause); if (ca != null) at = Math.max(now, ca); }
  }
  const arr = at + ((sym && cause) ? hop : 0);
  if (chain != null) { chainArr.set(chain + "|" + e.signal, arr); trimMap(chainArr, 4000); }
  if (sn < 0 && yn < 0) return;                  // not in view: nothing to light
  if (at <= now || sched.length > SCHED_MAX) fire(e, at, arr, n, hop, sn, yn); else sched.push({ at, arr, e, n, hop, sn, yn });
}
function trimMap(m, max) { if (m.size > max) { let c = m.size - max; for (const k of m.keys()) { m.delete(k); if (--c <= 0) break; } } }

function fire(e, at, arr, n, hop, sn, yn) {
  if (!V) return;
  const high = e.kind === "Digital" ? isHigh(e.value) : true, kind = e.kind;
  if (e.symbol && e.cause && yn >= 0 && yn < V.N) {
    const ci = G.sigIdx.get(e.cause), cn = ci !== undefined ? V.sigNode[ci] : -1;
    if (cn >= 0) for (let p = V.inS[yn]; p < V.inS[yn + 1]; p++) { const ed = V.inE[p]; if (V.A[ed] === cn) { litE.set(ed, { t: at, dur: hop / 2, high, kind }); break; } }
    if (sn >= 0) for (let p = V.outS[yn]; p < V.outS[yn + 1]; p++) { const ed = V.outE[p]; if (V.B[ed] === sn) { litE.set(ed, { t: at + hop / 2, dur: hop / 2, high, kind }); break; } }
    litN.set(yn, { t: at + hop / 4, high, kind, n: 1, ring: false });
  }
  if (sn >= 0 && sn < V.N) litN.set(sn, { t: arr, high, kind, n: Math.max(n, 1), ring: n >= 2 });
}
const loopSeen = new Map();   // signal -> { t, n, chain }: re-lit inside one burst (shown in the loops panel)

// ---------------------------------------------------------------- side panels
let burstDirty = false, loopsDirty = false, panelAt = 0, lastQl = 0;
function renderPanels(now) {
  if (now - panelAt < 250) return;
  panelAt = now;
  const ql = Q.length - qh;
  if (ql || lastQl) updateHud();
  lastQl = ql;
  if (loopsDirty || loopSeen.size) {
    loopsDirty = false;
    const rows = [];
    for (const [name, o] of osc) rows.push({ name, n: o.n, why: o.reason, bad: true, t: o.t });
    for (const [name, o] of loopSeen) {
      if (now - o.t > 8000) { loopSeen.delete(name); continue; }
      if (!osc.has(name)) rows.push({ name, n: o.n, why: "re-lit within one burst", bad: false, t: o.t });
    }
    rows.sort((a, b) => b.bad - a.bad || b.t - a.t);
    const box = $("#loopsList");
    box.innerHTML = rows.length ? "" : `<div class="none">None right now. A signal that changes again inside the same burst shows up here; one that changes more than ${OSC_CHAIN} times in a burst, or ${OSC_RATE}+ times a second, turns red.</div>`;
    for (const r of rows.slice(0, 40)) {
      const d = document.createElement("div"); d.className = "row" + (r.bad ? " osc" : "");
      d.innerHTML = `<span class="d">×${r.n}</span><span class="s">${esc(r.name)}<small>${r.bad ? "oscillating · " : ""}${esc(r.why)}</small></span><span class="v">${r.bad ? "●" : ""}</span>`;
      d.onclick = () => focusSignal(r.name);
      box.appendChild(d);
    }
  }
  if (burstDirty) {
    burstDirty = false;
    const b = lastBurst || [], box = $("#burstList");
    $("#burstInfo").textContent = b.length ? `${b.length} event${b.length === 1 ? "" : "s"}` : "";
    $("#replay").disabled = b.length === 0;
    box.innerHTML = b.length ? "" : `<div class="none">Waiting for a signal change…</div>`;
    const frag = document.createDocumentFragment();
    b.slice(0, 250).forEach(e => {
      const d = document.createElement("div"); d.className = "row";
      const via = e.cause ? `via ${esc(e.symbol ? symName(e.symbol) : "?")} ← ${esc(e.cause)}` : e.symbol ? `via ${esc(symName(e.symbol))}` : "external";
      const hi = e.kind === "Digital" && isHigh(e.value);
      d.innerHTML = `<span class="d">${e.depth ?? ""}</span><span class="s">${esc(e.signal)}<small>${via}</small></span><span class="v mono ${hi ? "hi" : ""}">${esc(fmt(e.kind, e.value))}</span>`;
      d.onclick = () => focusSignal(e.signal);
      frag.appendChild(d);
    });
    box.appendChild(frag);
    if (b.length > 250) box.insertAdjacentHTML("beforeend", `<div class="none">… ${b.length - 250} more</div>`);
  }
}
function focusSignal(name) {
  if (!V || !G) return;
  const id = G.sigIdx.get(name), n = id === undefined ? -1 : V.sigNode[id];
  if (n < 0) { setHud(`<span class="warn">${esc(name)} is not in the current view. Click it again after picking it as the start signal.</span>`); setStartPrompt(name); return; }
  panTo(n); flash = { n, t: performance.now() }; draw();
}
// Signals outside the view offer a one-click jump.
function setStartPrompt(name) { $("#hud").style.pointerEvents = "auto"; $("#hud").innerHTML += ` <a href="#" id="jump">Start from ${esc(name)}</a>`; $("#jump").onclick = ev => { ev.preventDefault(); $("#hud").style.pointerEvents = "none"; setStart(name, false); }; }

// ---------------------------------------------------------------- controls
function setStart(name, keepZoom) {
  const g = pendingG || G;
  if (!g || !g.sigIdx.has(name)) { $("#start").style.borderColor = "var(--err)"; return; }
  $("#start").style.borderColor = ""; startSig = name; $("#start").value = name; expanded.clear();
  try { history.replaceState(null, "", `?slot=${slot}&signal=${encodeURIComponent(name)}`); } catch { }
  const id = g.sigIdx.get(name);
  rebuild(!keepZoom, keepZoom ? () => { const n = V.sigNode[id]; if (n >= 0) panTo(n); draw(); } : null);
}
async function pulse(name) {
  try {
    await api(`/api/slots/${slot}/signals`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, pulse: true }) });
  } catch (e) { setHud(`<span class="bad">${esc(e.message)}</span>`); }
}
$("#pulse").onclick = () => { if (startSig) pulse(startSig); };
$("#fit").onclick = () => fit(true);
$("#dir").onchange = e => { cfg.dir = e.target.value; store.set("dir", cfg.dir); rebuild(true); };
$("#depth").oninput = e => { cfg.depth = Number(e.target.value); $("#depthv").textContent = cfg.depth; store.set("depth", cfg.depth); };
$("#depth").onchange = () => rebuild(true);
$("#whole").onchange = e => { cfg.whole = e.target.checked; store.set("whole", cfg.whole); rebuild(true); };
$("#follow").onchange = e => { cfg.follow = e.target.checked; store.set("follow", cfg.follow); };
document.querySelectorAll(".spd").forEach(b => b.onclick = () => {
  cfg.speed = Number(b.dataset.s); store.set("speed", cfg.speed);
  document.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", x === b));
});
$("#skip").onclick = () => { Q.length = 0; qh = 0; playClock = 0; sched.length = 0; updateHud(); };
$("#replay").onclick = () => {
  if (!lastBurst || !lastBurst.length) return;
  const id = "replay" + (++replaySeq), now = performance.now();
  // The whole burst is re-injected at once; the hop scheduler spaces it out by cause -> effect.
  for (const e of lastBurst) play(Object.assign({}, e, { chain: id }), now, true);
  draw();
};
$("#slot").onchange = e => switchSlot(Number(e.target.value));

// start-signal autocomplete (scans a pre-lowercased name list; never copies the 44k-entry map)
const inp = $("#start"), sugg = $("#sugg"); let suggIdx = -1, suggList = [];
function showSugg() {
  const g = G || pendingG; if (!g) return;
  const q = inp.value.trim().toLowerCase();
  if (!g.sigLower) g.sigLower = g.sigNames.length ? g.sigNames.join("\n").toLowerCase().split("\n") : [];
  const L = g.sigLower, starts = [], inc = [];
  for (let i = 0; i < L.length; i++) {
    const l = L[i];
    if (!q || l.startsWith(q)) { starts.push(i); if (starts.length >= 60) break; }
    else if (inc.length < 60 && l.includes(q)) inc.push(i);
  }
  suggList = starts.concat(inc).slice(0, 60).map(i => g.sigNames[i]); suggIdx = suggList.length ? 0 : -1;
  sugg.replaceChildren(...suggList.map((name, i) => {
    const d = document.createElement("div"); d.className = i === 0 ? "act" : ""; d.innerHTML = `${esc(name)}<i>${KINDS[g.sigKind[g.sigIdx.get(name)]]}</i>`;
    d.onmousedown = ev => { ev.preventDefault(); pick(name); }; return d;
  }));
  sugg.style.display = suggList.length ? "block" : "none";
}
function pick(name) { sugg.style.display = "none"; setStart(name, false); inp.blur(); }
inp.oninput = showSugg; inp.onfocus = () => { inp.select(); showSugg(); };
inp.onblur = () => { sugg.style.display = "none"; };
inp.onkeydown = e => {
  if (e.key === "ArrowDown" || e.key === "ArrowUp") {
    e.preventDefault(); if (!suggList.length) return;
    suggIdx = (suggIdx + (e.key === "ArrowDown" ? 1 : -1) + suggList.length) % suggList.length;
    [...sugg.children].forEach((c, i) => c.classList.toggle("act", i === suggIdx)); sugg.children[suggIdx].scrollIntoView({ block: "nearest" });
  } else if (e.key === "Enter") {
    e.preventDefault();
    const g = G || pendingG, exact = g && g.sigIdx.has(inp.value.trim()) ? inp.value.trim() : null;
    pick(exact || suggList[suggIdx] || inp.value.trim());
  } else if (e.key === "Escape") { sugg.style.display = "none"; inp.blur(); }
};

// ---------------------------------------------------------------- connection, slots
// Only real program lifecycle messages (ProgramSlot.cs) reload the wiring; ordinary program log output does not.
const LIFECYCLE = /^(Program started|Program stopped|Loaded .+ program '.*')$/;
function connect() {
  ws?.close();
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  const sock = ws = new WebSocket(`${proto}${location.host}/ws/trace?slot=${slot}`);
  sock.onopen = () => setConn(true);
  sock.onclose = () => { if (sock !== ws) return; setConn(false); setTimeout(() => { if (sock === ws) connect(); }, 2000); };
  sock.onmessage = ev => {
    const data = JSON.parse(ev.data);   // an array of events (a single object is accepted too)
    const now = performance.now();
    let got = false;
    for (const m of Array.isArray(data) ? data : [data]) {
      if (m.t === "trace") { onTrace(m, now); got = true; }
      else if (m.t === "log" && LIFECYCLE.test(String(m.message || "").trim())) { clearTimeout(reloadT); reloadT = setTimeout(() => { loadSlots(); loadGraph({ reload: true }); }, 400); }
    }
    if (got && !drawQueued) draw();
  };
}
let reloadT = null;
function setConn(ok) { $("#conn").innerHTML = `<i class="dot ${ok ? "ok" : "bad"}"></i>${ok ? "connected" : "reconnecting…"}`; }

async function loadSlots() {
  const slots = await api("/api/slots").catch(() => []);
  const sel = $("#slot");
  sel.replaceChildren(...slots.map(s => {
    const o = document.createElement("option"); o.value = s.number;
    o.textContent = `Slot ${pad(s.number)}${s.name ? " " + s.name : ""}${s.program ? " · " + s.program : ""}`; return o;
  }));
  sel.value = slot;
  const s = slots.find(x => x.number === slot);
  $("#prog").textContent = (s?.name ? s.name + " · " : "") + (s?.file ? `${s.file} · ${s.kind}` : "no program");
  $("#prog").style.cssText = s?.color ? `border-left:4px solid ${s.color};padding-left:6px` : "";
  document.title = `Paths · slot ${slot}${s?.name ? " " + s.name : ""}`;
  $("#dbglink").href = `debugger.html?slot=${slot}`;
}
function switchSlot(n) {
  slot = n; startSig = ""; expanded.clear(); vals = new Map(); Q.length = 0; qh = 0; sched.length = 0; droppedEv = 0;
  bursts.clear(); lastBurst = null; osc.clear(); loopSeen.clear(); burstDirty = loopsDirty = true;
  G = null; pendingG = null; V = null; litN.clear(); litE.clear(); hiSet.clear(); invalidateStatic(true); hideTip(); setHud("");
  try { history.replaceState(null, "", `?slot=${n}`); } catch { }
  loadSlots(); loadGraph({ force: true }); connect(); draw();
}

// restore saved settings
(() => {
  cfg.dir = store.get("dir", "fwd") === "back" ? "back" : "fwd"; $("#dir").value = cfg.dir;
  cfg.depth = Math.min(30, Math.max(1, Number(store.get("depth", 8)) || 8)); $("#depth").value = cfg.depth; $("#depthv").textContent = cfg.depth;
  cfg.whole = !!store.get("whole", false); $("#whole").checked = cfg.whole;
  cfg.follow = !!store.get("follow", false); $("#follow").checked = cfg.follow;
  const sp = store.get("speed", 1); cfg.speed = [1, 0.25, 0.1].includes(sp) ? sp : 1;
  document.querySelectorAll(".spd").forEach(x => x.classList.toggle("on", Number(x.dataset.s) === cfg.speed));
})();
$("#dbglink").href = `debugger.html?slot=${slot}`;
startWorker(); loadGraph({});
resize(); loopsDirty = burstDirty = true; renderPanels(performance.now() + 1000); panelAt = 0;
loadSlots(); connect();
// Test hook: lets automated tests read what is on screen.
window.__paths = {
  get view() { return V; }, get graph() { return G; }, cfg, litN, litE, osc, T, timing, hiSet,
  get queued() { return Q.length - qh; }, get dropped() { return droppedEv; },
  get ready() { return !!(V && frontOK && !job && !staticDirty && !viewPending); }
};
</script>
