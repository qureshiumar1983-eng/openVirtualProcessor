<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Link expired</title>
<style>
  :root { --bg:#0f1216; --card:#181d23; --line:#29303a; --text:#e6e9ee; --muted:#8b95a3; --err:#e05252; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100dvh; display:grid; place-items:center; padding:16px; font:16px/1.5 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  main { width:100%; max-width:420px; background:var(--card); border:1px solid var(--line); border-radius:12px; padding:28px 22px; text-align:center; }
  .mark { width:48px; height:48px; border-radius:50%; margin:0 auto 14px; display:grid; place-items:center; background:#3d1b1b; color:#ff9b9b; font-size:26px; font-weight:700; }
  h1 { font-size:20px; margin:0 0 8px; }
  p { margin:0; color:var(--muted); }
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">!</div>
  <h1>This link has expired or was revoked</h1>
  <p>Ask the person who sent it to share the panel with you again.</p>
</main>
</body>
</html>
