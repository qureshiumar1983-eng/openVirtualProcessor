<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenVP</title>
<style>
  :root { --bg:#0f1216; --card:#181d23; --line:#29303a; --text:#e6e9ee; --muted:#8b95a3; --ok:#2f9e6e; --warn:#d69e2e; --err:#e05252; --accent:#4c8dff; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.45 system-ui, sans-serif; background:var(--bg); color:var(--text); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:baseline; gap:12px; }
  header h1 { margin:0; font-size:18px; }
  header small, .muted { color:var(--muted); }
  a { color:var(--accent); }
  main { display:grid; grid-template-columns: 420px 1fr; gap:16px; padding:16px; align-items:start; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  section { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  h2 { font-size:12px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 10px; }
  table { width:100%; border-collapse:collapse; }
  td, th { text-align:left; padding:6px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--muted); font-weight:500; font-size:12px; }
  tr.slot { cursor:pointer; }
  tr.slot.sel { background:#1f2630; }
  .state { font-size:12px; padding:2px 8px; border-radius:20px; background:#252c36; }
  .Running { background:#173a2c; color:#7fe0b1; } .Error { background:#3d1b1b; color:#ff9b9b; } .Stopped { background:#3a321a; color:#f2cf7a; }
  button, input, select { font:inherit; color:var(--text); background:#111519; border:1px solid var(--line); border-radius:6px; padding:5px 9px; }
  button { cursor:pointer; } button:hover { border-color:var(--accent); }
  .bar { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:10px; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-size:12px; }
  #trace, #log, #console-out { height:220px; overflow:auto; background:#0b0e11; border:1px solid var(--line); border-radius:6px; padding:8px; white-space:pre-wrap; }
  #signals-wrap { max-height:340px; overflow:auto; }
  .lv-Error { color:var(--err); } .lv-Warning { color:var(--warn); } .lv-Notice { color:#9ecbff; } .lv-Console { color:#cfd6df; }
  .grid2 { display:grid; grid-template-columns: 1fr 1fr; gap:16px; }
  @media (max-width: 1200px) { .grid2 { grid-template-columns: 1fr; } }
  .dev { font-size:12px; color:var(--muted); }
  .on { color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>OpenVP</h1><small>open-source virtual control processor</small>
  <span style="flex:1"></span><a href="panel.html" target="_blank">Test panel ↗</a>
</header>
<main>
  <div>
    <section>
      <h2>Program slots</h2>
      <table id="slots"><thead><tr><th>#</th><th>Program</th><th>State</th></tr></thead><tbody></tbody></table>
    </section>
    <section style="margin-top:16px">
      <h2>Slot <span id="sel-num">1</span></h2>
      <div class="bar">
        <input type="file" id="file" accept=".cpz,.dll,.zip,.smw,.json,.lpz,.sig" multiple>
        <button id="upload">Load &amp; start</button>
        <button id="inspect" title="Report what OpenVP can run in a compiled .lpz (add its .sig for names)">Inspect .lpz</button>
      </div>
      <div class="bar">
        <button data-act="start">Start</button><button data-act="stop">Stop</button><button data-act="unload">Unload</button>
        <button id="compat">Compatibility</button>
      </div>
      <div id="sel-info" class="muted mono"></div>
      <div id="devices" style="margin-top:8px"></div>
    </section>
  </div>
  <div>
    <section>
      <h2>Debugger · slot <span class="sel-num2">1</span> <span class="muted" style="text-transform:none;letter-spacing:0">(only this slot's signals)</span></h2>
      <div class="bar">
        <input id="filter" placeholder="filter signals">
        <input id="set-name" placeholder="signal name" class="mono">
        <input id="set-value" placeholder="value (1, 0, 500, text)" class="mono">
        <button id="set">Set</button>
        <button id="pulse">Pulse</button>
      </div>
      <div class="grid2">
        <div id="signals-wrap"><table id="signals"><thead><tr><th>Signal</th><th>Type</th><th>Value</th></tr></thead><tbody></tbody></table></div>
        <div><div id="trace" class="mono"></div></div>
      </div>
    </section>
    <div class="grid2" style="margin-top:16px">
      <section>
        <h2>Console</h2>
        <div class="bar"><input id="console-in" class="mono" style="flex:1" placeholder="help, ipt, progcomments, or a program command"><button id="console-run">Run</button></div>
        <div id="console-out" class="mono"></div>
      </section>
      <section>
        <h2>Log</h2>
        <div id="log" class="mono"></div>
      </section>
    </div>
  </div>
</main>
<script>
const $ = s => document.querySelector(s);
let sel = 1, ws = null, signals = {};

async function api(path, opts) {
  const r = await fetch(path, opts);
  const ct = r.headers.get("content-type") || "";
  const body = ct.includes("json") ? await r.json() : await r.text();
  if (!r.ok) throw new Error(body.error || body || r.statusText);
  return body;
}

async function refreshSlots() {
  const slots = await api("/api/slots");
  const tb = $("#slots tbody"); tb.innerHTML = "";
  for (const s of slots) {
    const tr = document.createElement("tr");
    tr.className = "slot" + (s.number === sel ? " sel" : "");
    tr.innerHTML = `<td>${s.number}</td><td>${s.program ? `${s.program} <span class="muted">· ${s.kind}</span>` : '<span class="muted">empty</span>'}</td><td><span class="state ${s.state}">${s.state}</span></td>`;
    tr.onclick = () => select(s.number);
    tb.appendChild(tr);
    if (s.number === sel) {
      $("#sel-info").textContent = s.file ? `${s.file}${s.error ? "\n" + s.error.split("\n")[0] : ""}` : "No program loaded.";
      $("#devices").innerHTML = s.devices.map(d => `<div class="dev">IPID <b>${d.ipId}</b> · ${d.type} · <span class="${d.online ? "on" : ""}">${d.online ? "online" : "offline"}</span> · <a href="panel.html?ipid=${d.ipId}&slot=${d.slot}" target="_blank">open test panel</a></div>`).join("");
    }
  }
}

async function refreshSignals() {
  const list = await api(`/api/slots/${sel}/signals`).catch(() => []);
  signals = {};
  for (const s of list) signals[s.name] = s;
  renderSignals();
}

function renderSignals() {
  const f = $("#filter").value.toLowerCase();
  const tb = $("#signals tbody"); tb.innerHTML = "";
  for (const s of Object.values(signals)) {
    if (f && !s.name.toLowerCase().includes(f)) continue;
    const tr = document.createElement("tr");
    tr.innerHTML = `<td class="mono">${esc(s.name)}</td><td class="muted">${s.kind}</td><td class="mono">${esc(String(s.value))}</td>`;
    tr.onclick = () => { $("#set-name").value = s.name; };
    tb.appendChild(tr);
  }
}

function esc(t) { return t.replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c])); }

function line(el, text, cls) {
  const d = document.createElement("div"); if (cls) d.className = cls; d.textContent = text;
  el.appendChild(d); while (el.children.length > 500) el.removeChild(el.firstChild);
  el.scrollTop = el.scrollHeight;
}

function connectTrace() {
  ws?.close();
  const proto = location.protocol === "https:" ? "wss://" : "ws://";
  ws = new WebSocket(`${proto}${location.host}/ws/trace?slot=${sel}`);
  ws.onmessage = ev => {
    const m = JSON.parse(ev.data);
    const t = new Date(m.time).toLocaleTimeString();
    if (m.t === "trace") {
      line($("#trace"), `${t}  ${m.signal} = ${JSON.stringify(m.value)}  (${m.source})`);
      const s = signals[m.signal]; if (s) { s.value = m.value; renderSignals(); } else refreshSignals();
    } else if (m.t === "log") {
      line($("#log"), `${t}  ${m.level}  ${m.message}`, "lv-" + m.level);
      if (/Loaded|started|stopped/.test(m.message)) { refreshSlots(); refreshSignals(); }
    }
  };
}

async function loadLog() {
  $("#log").innerHTML = "";
  for (const e of await api(`/api/log?slot=${sel}&max=200`)) line($("#log"), `${new Date(e.time).toLocaleTimeString()}  ${e.level}  ${e.message}`, "lv-" + e.level);
}

function select(n) {
  sel = n; $("#sel-num").textContent = n; document.querySelectorAll(".sel-num2").forEach(e => e.textContent = n);
  $("#trace").innerHTML = ""; refreshSlots(); refreshSignals(); connectTrace(); loadLog();
}

function parseValue(v) {
  if (v === "true") return true; if (v === "false") return false;
  return /^\d+$/.test(v) ? Number(v) : v;
}

async function setSignal(name, value) {
  try { await api(`/api/slots/${sel}/signals`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ name, value }) }); }
  catch (e) { alert(e.message); }
}

$("#set").onclick = () => setSignal($("#set-name").value, parseValue($("#set-value").value));
$("#pulse").onclick = async () => { const n = $("#set-name").value; await setSignal(n, 1); setTimeout(() => setSignal(n, 0), 200); };
$("#filter").oninput = renderSignals;

$("#upload").onclick = async () => {
  const files = $("#file").files; if (!files.length) return alert("Choose a .cpz, .dll or .smw first.");
  const fd = new FormData();
  const main = [...files].find(f => /\.(lpz|cpz|dll|zip|smw)$/i.test(f.name)) || files[0];
  fd.append("file", main);
  for (const f of files) if (f !== main) fd.append("extra", f);
  try { await api(`/api/slots/${sel}/program`, { method: "POST", body: fd }); }
  catch (e) { alert(e.message); }
  refreshSlots(); refreshSignals();
};

document.querySelectorAll("[data-act]").forEach(b => b.onclick = async () => {
  try { await api(`/api/slots/${sel}/${b.dataset.act}`, { method: "POST" }); } catch (e) { alert(e.message); }
  refreshSlots(); refreshSignals();
});

$("#inspect").onclick = async () => {
  const files = $("#file").files; if (!files.length) return alert("Choose a .lpz (and optionally its .sig) first.");
  const fd = new FormData(); for (const f of files) fd.append("file", f);
  try { $("#console-out").textContent = await api("/api/inspect", { method: "POST", body: fd }); }
  catch (e) { alert(e.message); }
};

$("#compat").onclick = async () => { $("#console-out").textContent = await api(`/api/slots/${sel}/compat`); };

async function runConsole() {
  const cmd = $("#console-in").value; if (!cmd) return;
  const out = await api(`/api/slots/${sel}/console`, { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify({ command: cmd }) });
  line($("#console-out"), `SLOT${String(sel).padStart(2, "0")}> ${cmd}\n${out}`);
  $("#console-in").select();
}
$("#console-run").onclick = runConsole;
$("#console-in").onkeydown = e => { if (e.key === "Enter") runConsole(); };

select(1);
setInterval(refreshSlots, 3000);
</script>
</body>
</html>
