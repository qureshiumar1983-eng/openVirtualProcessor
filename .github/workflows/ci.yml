name: CI
# Runs on pull requests and by hand (Actions > CI > Run workflow), not on every push, to save Actions minutes.
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build OpenVP.sln -c Release
      - run: dotnet run --project tests/OpenVP.Tests -c Release --no-build
      # Informational only: shows throughput regressions in the log, never fails the build.
      - run: dotnet run --project tools/OpenVP.Bench -c Release --no-build -- --quick
        continue-on-error: true
