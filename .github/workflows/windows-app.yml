name: Windows app
# Builds OpenVP.exe, the Electron desktop app (portable: one file, no install, no .NET needed), starts it to
# check the console loads, and publishes it as a GitHub release.
# It runs by itself on every push to the production branch (merge main into production to ship), and can also be
# started by hand (Actions > Windows app > Run workflow). It does not run on pushes to main or other branches,
# because Windows runners bill minutes at twice the Linux rate.
#   - On production (a push, or run by hand there): makes a release numbered from desktop/package.json's version
#     plus the run number (e.g. v0.1.15), marked Latest. When run by hand, fill in "release" to choose the version.
#   - Run by hand on any other branch (main included): just builds and tests it (download from the run's
#     "OpenVP-windows" artifact), unless you fill in "release".
on:
  push:
    branches: [production]
  workflow_dispatch:
    inputs:
      release:
        description: Make a release with this version (e.g. v0.2.0). Leave empty to use the automatic number on production, or no release on other branches.
        required: false
        default: ''
concurrency:
  group: windows-app-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pick the version
        id: ver
        shell: pwsh
        run: |
          if ('${{ inputs.release }}' -ne '') { $tag = '${{ inputs.release }}' }
          else {
            $p = ((Get-Content desktop/package.json -Raw | ConvertFrom-Json).version -split '\.')
            $tag = "v$($p[0]).$($p[1]).$env:GITHUB_RUN_NUMBER"
          }
          "tag=$tag" >> $env:GITHUB_OUTPUT
          "Version: $tag"
      - name: Publish the server (self-contained, so no .NET install is needed)
        run: dotnet publish src/OpenVP.Server -c Release -r win-x64 --self-contained true -o desktop/server
      - name: Build OpenVP.exe (Electron, portable)
        working-directory: desktop
        run: |
          npm ci --no-audit --no-fund
          npm pkg set version=$('${{ steps.ver.outputs.tag }}'.TrimStart('v'))
          npm run dist
      - name: Smoke test (start the app, check the console answers, close it)
        shell: pwsh
        run: |
          Start-Process desktop\dist\OpenVP.exe
          $ok = $false
          for ($i = 0; $i -lt 90 -and -not $ok; $i++) {
            Start-Sleep 1
            try { $ok = (Invoke-RestMethod http://localhost:8080/api/info).name -eq 'OpenVP' } catch { }
          }
          if ($ok) {
            try {
              $ok = (Invoke-WebRequest http://localhost:8080/ -UseBasicParsing).Content -match 'OpenVP'
              $null = Invoke-WebRequest http://localhost:8080/panel.html -UseBasicParsing
            } catch { $ok = $false; $_ }
          }
          Get-Process OpenVP, openvp -ErrorAction SilentlyContinue | Stop-Process -Force
          $log = "$env:APPDATA\OpenVP\openvp.log"
          if (Test-Path $log) { Get-Content $log }
          if (-not $ok) { throw 'OpenVP.exe did not serve the console' }
          "OpenVP.exe size: {0:N0} MB" -f ((Get-Item desktop\dist\OpenVP.exe).Length / 1MB)
      - uses: actions/upload-artifact@v4
        with:
          name: OpenVP-windows
          path: desktop/dist/OpenVP.exe
      - name: Release (on production, or a version was given)
        if: github.ref == 'refs/heads/production' || inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          $subject = (git log -1 --format=%s $env:GITHUB_SHA)
          $notes = "Download **OpenVP.exe** below and run it. No install needed (Windows 10/11, 64-bit).`n`nBuilt from $($env:GITHUB_SHA.Substring(0,7)): $subject"
          gh release view $env:TAG 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:TAG --target $env:GITHUB_SHA --title "OpenVP $env:TAG" --notes $notes --latest
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }
          gh release upload $env:TAG desktop/dist/OpenVP.exe --clobber
