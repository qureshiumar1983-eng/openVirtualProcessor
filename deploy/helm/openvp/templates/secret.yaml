{{- if not .Values.existingSecret }}
{{- $name := include "openvp.fullname" . }}
{{- /* Keep the key that was made the first time, so an upgrade doesn't change it. */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
{{- $key := .Values.apiKey }}
{{- if and (not $key) $existing }}{{ $key = index $existing.data "api-key" | b64dec }}{{ end }}
{{- if not $key }}{{ $key = randAlphaNum 32 }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "openvp.labels" . | nindent 4 }}
type: Opaque
data:
  api-key: {{ $key | b64enc | quote }}
{{- end }}
