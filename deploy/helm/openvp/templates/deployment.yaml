apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openvp.fullname" . }}
  labels:
    {{- include "openvp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  # One pod owns the data volume: stop the old one before starting the new one.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "openvp.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      labels:
        {{- include "openvp.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openvp
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          {{- with .Values.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            - name: OpenVP__ApiKey
              valueFrom:
                secretKeyRef:
                  name: {{ include "openvp.secretName" . }}
                  key: {{ include "openvp.secretKey" . }}
            - name: OpenVP__Slots
              value: {{ .Values.openvp.slots | quote }}
            - name: OpenVP__LocalRequiresKey
              value: {{ .Values.openvp.localRequiresKey | quote }}
            - name: OpenVP__MetricsPublic
              value: {{ .Values.openvp.metricsPublic | quote }}
            - name: OpenVP__Mdns
              value: {{ .Values.openvp.mdns | quote }}
            - name: OpenVP__CipEnabled
              value: {{ .Values.openvp.cipEnabled | quote }}
            - name: TZ
              value: {{ .Values.openvp.timeZone | quote }}
            {{- if .Values.console.telnet.enabled }}
            - name: OpenVP__TelnetEnabled
              value: "true"
            - name: OpenVP__TelnetPort
              value: {{ .Values.console.telnet.port | quote }}
            {{- end }}
            {{- if .Values.console.ssh.enabled }}
            - name: OpenVP__SshEnabled
              value: "true"
            - name: OpenVP__SshPort
              value: {{ .Values.console.ssh.port | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: cip
              containerPort: 41794
              protocol: TCP
            {{- if .Values.console.telnet.enabled }}
            - name: telnet
              containerPort: {{ .Values.console.telnet.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.console.ssh.enabled }}
            - name: ssh
              containerPort: {{ .Values.console.ssh.port }}
              protocol: TCP
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/info
              port: http
            periodSeconds: {{ .Values.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.probes.startup.failureThreshold }}
          livenessProbe:
            httpGet:
              path: /api/info
              port: http
            initialDelaySeconds: {{ .Values.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: /api/info
              port: http
            initialDelaySeconds: {{ .Values.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.probes.readiness.failureThreshold }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /app/data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "openvp.claimName" . }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
